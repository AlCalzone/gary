function renderDetailInfo(d) {
  const verdict = str(d.state);
  detail.verdict.replaceChildren(...richText(verdict));
  const story = str(d.story).trim();
  // A blank line starts a new paragraph
  detail.story.replaceChildren(...story.split(/\n\s*\n/).map((para) => h("p", null, richText(para))));
  detail.story.hidden = !story;
  detail.verdict.hidden = !verdict;
  renderRounds(d);

  const badges = reviewBadges(d);
  detail.reviews.replaceChildren(...badges);
  detail.reviews.hidden = badges.length === 0;
  // An address_review card, or a take_over card that covers every thread, lists the threads itself
  const onCard = routesOf(d).some((r) => r.type === "address_review"
    || (r.type === "take_over" && takeOverThreads(d).length && takeOverThreads(d).length === reviewThreads(d).length));
  const threads = onCard ? null : buildThreads(d.threads);
  if (threads) {
    threads.open = detail.threadsOpen;
    threads.addEventListener("toggle", () => { detail.threadsOpen = threads.open; });
  }
  detail.threads.replaceChildren(...(threads ? [threads] : []));
  detail.threads.hidden = !threads;

  // Findings that belong to a route show on its card
  const loose = (Array.isArray(d.findings) ? d.findings : []).filter((f) => f && typeof f === "object" && !f.routeId);
  const findings = buildFindings(loose);
  if (findings) {
    // More than three findings start collapsed
    if (detail.findingsOpen === null) detail.findingsOpen = loose.length <= 3;
    findings.open = detail.findingsOpen;
    findings.addEventListener("toggle", () => { detail.findingsOpen = findings.open; });
  }
  detail.findings.replaceChildren(...(findings ? [findings] : []));
  detail.findings.hidden = !findings;

  const links = buildLinks(d.links);
  detail.links.replaceChildren(...(links ? [links] : []));
  detail.linksSec.hidden = !links;
  detail.support.hidden = !findings && !links;
}

const REACTION_EMOJI = { THUMBS_UP: "👍", HEART: "❤️", HOORAY: "🎉", ROCKET: "🚀", EYES: "👀" };

// ---------- saved drafts ----------

// Typed step texts survive a reload. Keys are item, step and draft hash, so a rewritten draft drops the old text.
// The draft hash each in-memory step draft was typed against
const draftHashes = new Map();

function readDraftStore() {
  try {
    const v = JSON.parse(localStorage.getItem(storeKey("drafts")) || "{}");
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  } catch {
    return {};
  }
}

function writeDraftStore(store) {
  try {
    localStorage.setItem(storeKey("drafts"), JSON.stringify(store));
  } catch {
    // Drafts then live only until the next reload
  }
}

function saveDraft(itemId, stepId, hash, text) {
  const store = readDraftStore();
  store[itemId + "|" + stepId + "|" + hash] = text;
  writeDraftStore(store);
}

function dropSavedDraft(itemId, stepId) {
  const store = readDraftStore();
  const prefix = itemId + "|" + stepId + "|";
  for (const k of Object.keys(store)) if (k.startsWith(prefix)) delete store[k];
  writeDraftStore(store);
}

function savedDraft(itemId, stepId, hash) {
  const store = readDraftStore();
  const prefix = itemId + "|" + stepId + "|";
  let found = null;
  let changed = false;
  for (const k of Object.keys(store)) {
    if (!k.startsWith(prefix)) continue;
    if (k === prefix + hash && typeof store[k] === "string") found = store[k];
    else {
      delete store[k];
      changed = true;
    }
  }
  if (changed) writeDraftStore(store);
  return found;
}

// ---------- route cards ----------

// Allowed actors per route type. The first one is the default.
const ROUTE_ACTORS = {
  reply: ["me", "bot"],
  request_logs: ["bot"],
  close: ["me"],
  reopen: ["bot", "me"],
  merge: ["me"],
  review: ["bot"],
  address_review: ["agent"],
  follow_up: ["agent", "bot", "me"],
  take_over: ["agent"],
  drive: ["agent"],
  move: ["bot", "me"],
  chore: ["bot"],
};
const CHORE_LABELS = {
  label: "Change labels", assign: "Assign", ready: "Mark ready", answer_discussion: "Mark as answer",
  react: "React", update_branch: "Update branch", rerun_ci: "Re-run CI",
};
const CLOSE_REASONS = { completed: "Completed", not_planned: "Not planned", duplicate: "Duplicate" };
// Labels for the agent's verdict on a review thread, shown next to the maintainer's own decision
const VERDICT_LABELS = {
  valid: ["valid", "v-valid"],
  optional: ["optional", "v-optional"],
  wrong: ["not needed", "v-wrong"],
  unjudged: ["not judged", "v-unjudged"],
};

// Routes the configured accounts can run. The server marks the others "unavailable".
function routesOf(d) {
  return (Array.isArray(d.routes) ? d.routes : [])
    .filter((r) => r && typeof r === "object" && typeof r.id === "string" && Object.hasOwn(ROUTE_ACTORS, r.type))
    // A move to another repo has one actor per button, so only its buttons decide
    .filter((r) => r.actor === undefined || ROUTE_ACTOR_KINDS.has(r.actor) || (r.type === "move" && moveToRepo(r) && r.actors))
    .filter((r) => r.type !== "move" || str(paramsOf(r).to) !== "issue" || escalateCommand() !== "")
    .filter((r) => r.type !== "move" || !moveToRepo(r) || ["transfer", "close"].some((m) => moveActor(r, m) !== null));
}

function escalateCommand() {
  return str(boardCap.botCommands.escalate).trim();
}

function recommendedRoute(d) {
  const routes = routesOf(d);
  return routes.find((r) => r.recommended === true) || routes[0] || null;
}

// "own" runs under the maintainer's GitHub login after the click, "me" is a prefill he finishes on GitHub
const ROUTE_ACTOR_KINDS = new Set(["me", "bot", "own", "agent"]);

function actorOf(r) {
  if (ROUTE_ACTOR_KINDS.has(r.actor)) return r.actor;
  const allowed = ROUTE_ACTORS[r.type];
  return allowed.includes(r.as) ? r.as : allowed[0];
}

// The actor of one button of a move to another repo, or null when nobody can run it
function moveActor(r, mode) {
  const given = r.actors && typeof r.actors === "object" ? r.actors[mode] : undefined;
  if (given === undefined) return ROUTE_ACTOR_KINDS.has(r.actor) ? r.actor : "bot";
  return ROUTE_ACTOR_KINDS.has(given) ? given : null;
}

function paramsOf(r) {
  return r.params && typeof r.params === "object" && !Array.isArray(r.params) ? r.params : {};
}

function hasText(r) {
  return str(r.text).trim() !== "";
}

// A move to another repo, on an issue. Discussions and issues moving to a discussion go through GitHub by hand.
function moveToRepo(r) {
  const to = str(paramsOf(r).to);
  return to !== "" && to !== "discussion" && to !== "issue";
}

function routeIntent(r) {
  const p = paramsOf(r);
  switch (r.type) {
    case "merge": return "finish";
    case "close": return "close";
    case "review": return p.event === "approve" ? "finish" : p.event === "request_changes" ? "push" : "talk";
    case "reply":
    case "request_logs": return "talk";
    case "address_review":
    case "take_over":
    case "drive": return "agent";
    case "follow_up": return actorOf(r) === "agent" ? "agent" : "talk";
    case "chore": return intentOf(str(p.action));
    default: return "other";
  }
}

// A route without text or choices is one row with its button. Everything else is a card that expands.
function routeCompact(r) {
  switch (r.type) {
    case "chore": return true;
    case "merge":
    case "close":
    case "reopen": return !hasText(r);
    case "move": return !moveToRepo(r) || !hasText(r);
    default: return false;
  }
}

function routeHasEditor(r) {
  switch (r.type) {
    case "reply":
    case "request_logs":
    case "review":
    case "address_review":
    case "take_over":
    case "follow_up": return true;
    case "close":
    case "reopen":
    case "merge":
    case "move": return hasText(r);
    default: return false;
  }
}

function editorLabel(r) {
  const as = actorOf(r);
  if (r.type === "address_review") return "Note for the whole run (optional)";
  if (r.type === "take_over" || (r.type === "follow_up" && as === "agent")) return "Instructions for the agent (optional)";
  if (r.type === "follow_up") return "Issue text";
  if (r.type === "review") return "Review summary";
  if (r.type === "move") return "Comment before closing";
  if (r.type === "reopen" && as !== "me") return "Comment before reopening";
  return null;
}

function editorRows(r) {
  if (r.type === "request_logs") return 8;
  const label = editorLabel(r);
  return label && label.endsWith("(optional)") ? 3 : 6;
}

// The buttons of a card. Most routes have one. A move to another repo has two.
function routeButtons(d, r) {
  const as = actorOf(r);
  const p = paramsOf(r);
  const text = hasText(r);
  const me = (label, extra = {}) => ({ id: "main", actor: "me", label, copy: "draft", ...extra });
  const run = (label, extra = {}) => ({ id: "main", actor: as, label, ...extra });
  const event = { approve: "Approve", request_changes: "Request changes", comment: "Comment" }[p.event] || "Submit review";
  switch (r.type) {
    case "reply": return [as === "me" ? me("Copy reply, open GitHub") : run("Post reply", { confirm: true, needsText: true })];
    case "request_logs": return [as === "me" ? me("Copy request, open GitHub") : run("Ask for a debug log", { confirm: true, needsText: true })];
    case "close": return [me(text ? "Copy reply, open GitHub to close" : "Open GitHub to close")];
    case "merge": return [me(text ? "Copy text, open GitHub to merge" : "Open GitHub to merge")];
    case "reopen": return [as === "me" ? me(text ? "Copy reply, open GitHub to reopen" : "Open GitHub to reopen")
      : run("Reopen", { confirm: text, confirmVerb: "post and reopen" })];
    case "review": return [as === "me" ? me("Copy review, open GitHub to " + event.toLowerCase()) : run(event, { confirm: true })];
    case "address_review": return [{ id: "main", actor: "agent", label: "Address the review" }];
    case "follow_up":
      if (as === "agent") return [{ id: "main", actor: "agent", label: "Start fix" }];
      if (as === "me") return [me("Open GitHub to file the issue", { copy: null })];
      return [run("File issue", { confirm: true })];
    case "take_over": return [{ id: "main", actor: "agent", label: p.mode === "replace" ? "Open a replacement PR" : "Take over" }];
    case "drive": return [{ id: "main", actor: "agent", label: "Drive this PR" }];
    case "move": {
      if (str(p.to) === "discussion") return [me("Open GitHub to convert", { copy: null })];
      if (str(p.to) === "issue") return [me("Copy escalate command, open GitHub", { copy: "escalate" })];
      const out = [];
      const ta = moveActor(r, "transfer");
      if (ta) out.push({ id: "transfer", actor: ta, label: "Transfer to " + str(p.to), confirm: true, input: { mode: "transfer" } });
      const ca = text ? moveActor(r, "close") : null;
      if (ca === "me") out.push({ id: "close", actor: "me", label: "Copy text, open GitHub to close", copy: "draft", reveal: true });
      else if (ca) out.push({ id: "close", actor: ca, label: "Close, ask to reopen there", confirm: true, reveal: true, needsText: true, confirmVerb: "post and close", input: { mode: "close" } });
      return out;
    }
    case "chore": {
      const label = CHORE_LABELS[p.action] || str(p.action) || "Run";
      return [run(p.action === "react" ? (REACTION_EMOJI[p.content] || REACTION_EMOJI.THUMBS_UP) + " " + label : label)];
    }
    default: return [];
  }
}

function confirmText(b) {
  return "Confirm: " + (b.confirmVerb || b.label.toLowerCase()) + " as " + (b.actor === "own" ? "you" : botLogin());
}

function buttonTip(b) {
  if (b.actor === "agent") return "The agent does this";
  if (b.actor === "bot") return botLogin() + (b.confirm ? " does this after you confirm" : " does this now");
  if (b.actor === "own") return "Runs right away under your GitHub login" + (b.confirm ? ", after you confirm" : "");
  return b.copy ? "Copies the text and opens GitHub, you post it" : "Opens GitHub, you do it there";
}

function repoBase(d) {
  if (isGithubUrl(str(boardCap.repoUrl))) return str(boardCap.repoUrl).replace(/\/$/, "");
  const m = /^https:\/\/github\.com\/[^/]+\/[^/]+/.exec(str(d.url));
  return m ? m[0] : "https://github.com";
}

// The GitHub page a route in his name opens
function routeTarget(d, r, title, body) {
  const url = str(d.url);
  if (r.type === "follow_up") {
    return repoBase(d) + "/issues/new?title=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(body);
  }
  if (r.type === "merge" || r.type === "move" || d.kind === "discussion") return url;
  if (r.type === "review") return url + "/files";
  return url + "#issuecomment-new";
}

// ---------- opened today ----------

// Routes he opened on GitHub today, kept in this browser. The routine sees his real comment or merge on its next run.

function openedKey(id, r) {
  return [id, r.id, str(r.draftHash), dayKey(Date.now())].join("|");
}

function readOpened() {
  try {
    const v = JSON.parse(localStorage.getItem(storeKey("opened")) || "{}");
    return v && typeof v === "object" && !Array.isArray(v) ? v : {};
  } catch {
    return {};
  }
}

function openedToday(id, r) {
  return readOpened()[openedKey(id, r)] === true;
}

function itemOpenedToday(id) {
  const today = "|" + dayKey(Date.now());
  return Object.keys(readOpened()).some((k) => k.startsWith(id + "|") && k.endsWith(today));
}

function markOpened(id, r) {
  const store = readOpened();
  const today = "|" + dayKey(Date.now());
  // Keep only today's marks
  for (const k of Object.keys(store)) if (!k.endsWith(today)) delete store[k];
  store[openedKey(id, r)] = true;
  try {
    localStorage.setItem(storeKey("opened"), JSON.stringify(store));
  } catch {
    // Without storage the mark lasts until the next reload
  }
}

// Project, repo and accounts from the board server. Nothing about one project is built into the page.
let boardCap = { name: "", repo: "", repoUrl: "", me: null, bot: null, botCommands: {}, dryRun: false };

const botLogin = () => str(boardCap.bot && boardCap.bot.login) || "the bot";

// Copies the project's info in, names the page after it and moves this browser's old keys to the repo's own keys
function applyBoardInfo(b) {
  if (!b || typeof b !== "object") return;
  boardCap = { ...boardCap, ...b, botCommands: b.botCommands && typeof b.botCommands === "object" ? b.botCommands : {} };
  const repo = str(boardCap.repo);
  if (/^[\w.-]+\/[\w.-]+$/.test(repo)) {
    storagePrefix = "gary:" + repo + ":";
    try {
      // Move the keys of the tool's previous name once. The old prefix is assembled so the old name appears nowhere else
      const oldPrefix = ["triage", "board"].join("-") + ":" + repo + ":";
      const legacy = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i) || "";
        if (k.startsWith(oldPrefix)) legacy.push(k);
      }
      for (const old of legacy) {
        const v = localStorage.getItem(old);
        const key = storagePrefix + old.slice(oldPrefix.length);
        if (v !== null && localStorage.getItem(key) === null) localStorage.setItem(key, v);
        localStorage.removeItem(old);
      }
    } catch {
      // Without storage there is nothing to move
    }
  }
  const name = str(boardCap.name).trim();
  document.title = name ? name + " triage" : "Gary";
  document.getElementById("board-title").textContent = name ? name + " triage" : "Gary";
  document.getElementById("dry-run").hidden = boardCap.dryRun !== true;
}

// ---------- running a route ----------

function confirmMode(id, key) {
  const c = state.confirming.get(id);
  return c === key ? "normal" : c === key + "!force" ? "force" : null;
}

// Maps a failed /api/action call to a readable note. Refusals carry their reason from the server.
function routeFailure(e, r) {
  if (e && e.code === "tool_error") {
    const env = e.result;
    const t = env && Array.isArray(env.content) ? env.content.find((c) => c && c.type === "text") : null;
    const p = parseToolPayload(t && t.text);
    // A repeated click on an agent route finds the first request still in the queue
    if (p && p.duplicate === true && actorOf(r) === "agent") return "Already requested. The agent has it on its list.";
    if (p) return resultString(p.result) || "The action failed.";
  }
  if (e && (e.code === "server_not_connected" || e.code === "server_not_found" || e.code === "bad_request")) {
    return "The board server is not reachable. Nothing was sent.";
  }
  return "The board server did not confirm the result. Check GitHub before you click again.";
}

// Sends a bot or agent route to the server. The server reads type, actor and params from the item file and logs the click.
async function runRoute(id, r, payload) {
  if (state.busy.has(id)) return;
  const key = "r:" + r.id;
  detail.lastZone = "route";
  detail.lastRoute = r.id;
  state.notes.delete(id);
  state.busy.add(id);
  render();
  try {
    if (!state.mcp) throw Object.assign(new Error("No server"), { code: "server_not_connected" });
    await state.mcp.callTool(SERVER, r.type, {
      itemId: id, routeId: r.id, text: str(payload.text), draftHash: str(r.draftHash),
      force: payload.force === true, input: payload.input || {},
    });
    state.notes.set(id, { kind: "done", text: actorOf(r) === "agent" ? "The agent is on it" : "Done: " + str(r.title) });
    state.drafts.delete(draftKey(id, key));
    dropSavedDraft(id, r.id);
    detail.openRoute = r.id;
  } catch (e) {
    state.notes.set(id, { kind: "failed", text: routeFailure(e, r) });
  } finally {
    state.busy.delete(id);
    render();
  }
}

// ---------- card building ----------
// ---------- card building ----------

function textEditor(id, r, key, label, value, rows) {
  const dk = draftKey(id, key);
  const storeId = key.slice(2);
  if (!state.drafts.has(dk) || draftHashes.get(dk) !== str(r.draftHash)) {
    state.drafts.delete(dk);
    const saved = savedDraft(id, storeId, str(r.draftHash));
    if (saved !== null) {
      state.drafts.set(dk, saved);
      draftHashes.set(dk, str(r.draftHash));
    }
  }
  const field = h(rows ? "textarea" : "input", {
    id: "ed-" + id + "-" + key.replace(/[^A-Za-z0-9_-]/g, "_"), "data-focus-key": dk,
    class: rows ? (rows >= 8 ? "tall" : rows <= 3 ? "short" : null) : "field", type: rows ? null : "text", rows: rows ? String(rows) : null,
    "aria-label": label || "Text", value: getDraft(id, key, value),
  });
  field.addEventListener("input", () => {
    state.drafts.set(dk, field.value);
    draftHashes.set(dk, str(r.draftHash));
    saveDraft(id, storeId, str(r.draftHash), field.value);
    if (rows) grow(field);
  });
  return field;
}

function closeReasonBadge(d, r) {
  const p = paramsOf(r);
  if (d.kind === "pr" || !Object.hasOwn(CLOSE_REASONS, p.reason)) return null;
  if (p.reason === "duplicate" && Number.isInteger(p.duplicateOf)) {
    const url = repoBase(d) + "/issues/" + p.duplicateOf;
    return h("span", { class: "sbadge tone-muted reason" }, "Duplicate of ", ghLink(url, "#" + p.duplicateOf));
  }
  return h("span", { class: "sbadge tone-muted reason", text: CLOSE_REASONS[p.reason] });
}

// The diff lines an inline comment refers to, at most 12, colored like GitHub
function diffHunk(text) {
  const lines = str(text).replace(/\n$/, "").split("\n");
  if (!str(text).trim()) return null;
  return h("pre", { class: "hunk" }, lines.slice(-12).map((l) => h("span", {
    class: l.startsWith("@@") ? "h-hdr" : l.startsWith("+") ? "h-add" : l.startsWith("-") ? "h-del" : "h-ctx", text: l + "\n",
  })));
}

function segControl(label, options, value, onPick) {
  const buttons = options.map(([v, text]) => {
    const b = h("button", { type: "button", class: "seg", "data-v": v, "aria-pressed": v === value ? "true" : "false", text });
    b.addEventListener("click", () => {
      for (const o of buttons) o.setAttribute("aria-pressed", o === b ? "true" : "false");
      onPick(v);
    });
    return b;
  });
  return h("span", { class: "seg-group", role: "group", "aria-label": label }, buttons);
}

function reviewThreads(d) {
  return (Array.isArray(d.threads) ? d.threads : []).filter((t) => t && typeof t === "object" && typeof t.id === "string");
}

// On a contributor's PR fixing review comments ourselves is a take-over, so its card carries the judged threads
function takeOverThreads(d) {
  return reviewThreads(d).filter((t) => t.verdict === "valid" || t.verdict === "optional" || t.verdict === "wrong");
}

// One row per review thread: the agent's verdict, his fix or dismiss decision and an optional note
function buildDecisions(rec, threads) {
  return h("ul", { class: "decisions" }, threads.map((t) => {
    const verdict = Object.hasOwn(VERDICT_LABELS, t.verdict) ? t.verdict : "unjudged";
    if (!rec.decisions.has(t.id)) rec.decisions.set(t.id, { decision: verdict === "wrong" ? "dismiss" : "fix", note: "", noteOpen: false });
    const st = rec.decisions.get(t.id);
    const [label, cls] = VERDICT_LABELS[verdict];
    const note = h("input", { type: "text", class: "field d-note", "aria-label": "Note for this comment", value: st.note, hidden: !st.noteOpen });
    note.addEventListener("input", () => { st.note = note.value; });
    const addNote = h("button", { type: "button", class: "lane-switch", text: "Add a note", hidden: st.noteOpen });
    addNote.addEventListener("click", () => {
      st.noteOpen = true;
      note.hidden = false;
      addNote.hidden = true;
      note.focus();
    });
    return h("li", null,
      h("span", { class: "t-head" },
        h("span", { class: "t-summary" }, richText(str(t.summary) || "No summary yet.")),
        h("span", { class: "vlabel " + cls, title: "The agent's verdict", text: label })),
      str(t.note) ? h("span", { class: "t-note" }, richText(t.note)) : null,
      h("span", { class: "t-ref" }, reviewerName(str(t.author)) || "unknown",
        t.path ? " · " : null, t.path ? h("code", { text: str(t.path) + (Number.isInteger(t.line) ? ":" + t.line : "") }) : null),
      h("span", { class: "seg-row" },
        segControl("Decision", [["fix", "Fix"], ["dismiss", "Dismiss"]], st.decision, (v) => { st.decision = v; }),
        addNote),
      note);
  }));
}

// Inputs a card collects besides its main text. Kept per card, so a re-render does not lose choices.
function buildCardInputs(id, d, r, rec) {
  const out = [];
  const p = paramsOf(r);
  const as = actorOf(r);
  if (r.type === "follow_up" && as !== "agent") {
    rec.titleInput = textEditor(id, r, "r:" + r.id + ":title", "Issue title", str(p.title), 0);
    out.push(h("label", { class: "card-label", for: rec.titleInput.id }, "Issue title"), rec.titleInput);
  }
  const editor = [];
  if (routeHasEditor(r)) {
    const label = editorLabel(r);
    rec.ta = textEditor(id, r, "r:" + r.id, label || "Draft text", str(r.text), editorRows(r));
    if (label) editor.push(h("label", { class: "card-label", for: rec.ta.id }, label));
    editor.push(rec.ta);
    if (r.type === "request_logs") {
      const reset = h("button", { type: "button", class: "lane-switch", text: "Reset to template", "data-focus-key": "r:" + r.id + ":reset" });
      const sync = () => { reset.hidden = rec.ta.value === str(r.text); };
      reset.addEventListener("click", () => {
        rec.ta.value = str(r.text);
        state.drafts.delete(draftKey(id, "r:" + r.id));
        dropSavedDraft(id, r.id);
        sync();
        rec.ta.focus();
      });
      rec.ta.addEventListener("input", sync);
      sync();
      editor.push(h("div", { class: "editor-tools" }, reset));
    }
  }
  if (r.type === "move" && moveToRepo(r)) {
    // The canned text only matters for "Close, ask to reopen there", so it shows once he picks that button
    rec.revealBox = h("div", { class: "reveal", hidden: !rec.revealed }, ...editor);
    out.push(rec.revealBox);
  } else if (r.type === "take_over" && takeOverThreads(d).length) {
    out.push(buildDecisions(rec, takeOverThreads(d)), ...editor);
  } else if (r.type !== "address_review") {
    out.push(...editor);
  }
  if (r.type === "review") {
    const comments = (Array.isArray(p.comments) ? p.comments : []).filter((c) => c && typeof c === "object" && typeof c.id === "string");
    if (comments.length) {
      out.push(h("ul", { class: "checklist" }, comments.map((c) => {
        if (!rec.checks.has(c.id)) rec.checks.set(c.id, true);
        const box = h("input", { type: "checkbox", id: "cm-" + id + "-" + c.id.replace(/[^A-Za-z0-9_-]/g, "_"), checked: rec.checks.get(c.id) });
        box.addEventListener("change", () => rec.checks.set(c.id, box.checked));
        const range = Number.isInteger(c.startLine) && Number.isInteger(c.line) && c.startLine < c.line ? c.startLine + "-" + c.line
          : Number.isInteger(c.line) ? String(c.line) : "";
        const where = str(c.path) + (range ? ":" + range : "");
        return h("li", null, box, h("div", { class: "c-body" },
          h("label", { for: box.id }, where ? h("code", { class: "c-where", text: where }) : "Comment"),
          diffHunk(c.diffHunk),
          h("span", { class: "c-text" }, richText(c.text))));
      })));
    }
  }
  if (r.type === "address_review") {
    out.push(buildDecisions(rec, reviewThreads(d)), ...editor);
  }
  if (r.type === "drive") {
    const max = Number.isInteger(p.maxRounds) && p.maxRounds >= 1 && p.maxRounds <= 3 ? p.maxRounds : 3;
    if (!rec.rounds) rec.rounds = max;
    const line = h("p", { class: "card-text" });
    const say = () => line.replaceChildren("Address comments, push, request a Copilot review, up to " + rec.rounds + (rec.rounds === 1 ? " round." : " rounds."));
    say();
    out.push(line, h("span", { class: "seg-row" }, h("span", { class: "card-label" }, "Rounds"),
      segControl("Rounds", [[1, "1"], [2, "2"], [3, "3"]], rec.rounds, (v) => { rec.rounds = v; say(); })));
  }
  return out;
}

function routePayload(d, r, rec, b) {
  const input = { ...(b && b.input ? b.input : {}) };
  if (r.type === "review") input.commentIds = [...rec.checks].filter(([, on]) => on).map(([cid]) => cid);
  if (r.type === "address_review" || (r.type === "take_over" && takeOverThreads(d).length)) {
    input.decisions = [...rec.decisions].map(([threadId, st]) => ({ threadId, decision: st.decision, ...(st.note.trim() ? { note: st.note.trim() } : {}) }));
  }
  if (r.type === "follow_up" && rec.titleInput && rec.titleInput.value !== str(paramsOf(r).title)) input.title = rec.titleInput.value;
  if (r.type === "drive") input.maxRounds = rec.rounds;
  // A transfer moves the issue as it is, so no draft text goes along
  const text = b && b.input && b.input.mode === "transfer" ? "" : rec.ta ? rec.ta.value : str(r.text);
  return { text, input };
}

function meButton(id, d, r, rec, b, intent, locked) {
  const key = "r:" + r.id + ":" + b.id;
  return h("button", {
    class: "btn me-btn intent-" + intent + (r.recommended === true ? " primary" : ""), type: "button",
    disabled: locked || !isGithubUrl(str(d.url)), "data-focus-key": key, title: buttonTip(b),
    onclick: async () => {
      if (!isGithubUrl(str(d.url))) return;
      if (b.reveal && !rec.revealed) {
        rec.revealed = true;
        if (rec.revealBox) rec.revealBox.hidden = false;
        if (rec.ta) rec.ta.focus();
        return;
      }
      postDecision({ itemId: id, routeId: r.id, text: rec.ta ? rec.ta.value : "" });
      const copy = b.copy === "escalate" ? escalateCommand() : b.copy === "draft" && rec.ta ? rec.ta.value : "";
      let fallback = false;
      if (copy.trim()) {
        try {
          await navigator.clipboard.writeText(copy);
        } catch {
          fallback = true;
          if (rec.ta && copy === rec.ta.value) {
            rec.ta.focus();
            rec.ta.select();
          }
        }
      }
      window.open(routeTarget(d, r, rec.titleInput ? rec.titleInput.value : str(paramsOf(r).title), rec.ta ? rec.ta.value : str(r.text)), "_blank", "noopener,noreferrer");
      if (fallback) detail.meNotes.set(r.id, b.copy === "escalate" ? "Copy failed. Post " + escalateCommand() + " on GitHub" : "Press Ctrl+C, then paste on GitHub");
      else detail.meNotes.delete(r.id);
      markOpened(id, r);
      render();
    },
  }, actorMark("me"), b.label, icon("external", null, "ext"));
}

// The card's button row: its buttons with their actors, the second confirm, "Post anyway", or the result
function buildCardActions(id, d, r, rec, locked) {
  const intent = routeIntent(r);
  const note = state.notes.get(id);
  const mine = detail.lastRoute === r.id;
  const buttons = routeButtons(d, r);

  if (r.done && typeof r.done === "object") {
    const result = str(r.done.result);
    const as = actorOf(r);
    return [h("span", { class: "status done step-done" }, icon("doneCheck"),
      h("span", { text: as !== "agent" ? "Done" : r.done.status === "queued" ? "Requested. The agent has it on its list." : "The agent took this on" }),
      isGithubUrl(result) ? ghLink(result, "view on GitHub") : null)];
  }
  if (mine && note && note.kind === "done") {
    return [h("span", { class: "status done step-done" }, icon("doneCheck"), h("span", { text: note.text }))];
  }
  if (r.type === "close" && isClosedThread(id, d)) {
    return [h("span", { class: "status done step-done" }, icon("check"), h("span", { text: "Already closed" }))];
  }

  if (buttons.every((b) => b.actor === "me")) {
    return [...buttons.map((b) => meButton(id, d, r, rec, b, intent, locked)),
      openedToday(id, r) ? h("span", { class: "opened-mark", title: "You opened this on GitHub today" }, "opened") : null,
      detail.meNotes.has(r.id) ? h("span", { class: "me-note", text: detail.meNotes.get(r.id) }) : null].filter(Boolean);
  }

  const send = (b, force) => {
    state.confirming.delete(id);
    rec.lastButton = b.id;
    runRoute(id, r, { ...routePayload(d, r, rec, b), force });
  };
  const confirming = buttons.find((b) => confirmMode(id, "r:" + r.id + ":" + b.id));
  if (confirming) {
    const mode = confirmMode(id, "r:" + r.id + ":" + confirming.id);
    return [
      h("button", {
        class: "btn confirm intent-" + intent, type: "button", disabled: locked, "data-focus-key": "r:" + r.id + ":" + confirming.id + ":confirm", title: buttonTip(confirming),
        onclick: () => send(confirming, mode === "force"),
      }, actorMark(confirming.actor), confirmText(confirming)),
      h("button", {
        class: "btn quiet", type: "button", "data-focus-key": "r:" + r.id + ":" + confirming.id, text: "Cancel",
        onclick: () => { state.confirming.delete(id); render(); },
      }),
    ];
  }
  const refused = r.refused && typeof r.refused === "object" ? r.refused : null;
  const out = buttons.map((b, i) => {
    const key = "r:" + r.id + ":" + b.id;
    if (b.actor === "me") return meButton(id, d, r, rec, b, intent, locked);
    return h("button", {
      class: "btn intent-" + intent + (r.recommended === true && i === 0 ? " primary" : ""), type: "button", disabled: locked,
      "data-focus-key": key, "data-focus-alt": key + ":confirm", title: buttonTip(b),
      onclick: () => {
        if (b.reveal && !rec.revealed) {
          rec.revealed = true;
          if (rec.revealBox) rec.revealBox.hidden = false;
          if (rec.ta) {
            grow(rec.ta);
            rec.ta.focus();
          }
          return;
        }
        const payload = routePayload(d, r, rec, b);
        if (b.needsText && !payload.text.trim()) {
          detail.lastZone = "route";
          detail.lastRoute = r.id;
          state.notes.set(id, { kind: "failed", text: "Write the text first. This route posts it." });
          render();
          return;
        }
        if (b.confirm) {
          state.confirming.set(id, key);
          state.notes.delete(id);
          render();
          return;
        }
        send(b, false);
      },
    }, actorMark(b.actor), b.label);
  });
  if (r.type === "take_over") out.push(h("span", { class: "quiet-line", text: "Commits as " + (boardCap.bot ? botLogin() : str(boardCap.me && boardCap.me.login) || "you") }));
  // A prefill and a direct run can share a card, so the note names the button that runs at once
  const ownButtons = buttons.filter((b) => b.actor === "own");
  if (ownButtons.length) {
    out.push(h("span", { class: "quiet-line", text: (ownButtons.length < buttons.length ? ownButtons[0].label + " runs" : "Runs") + " right away under your GitHub login" }));
  }
  // The server refused because the thread moved. The maintainer may override that after a second look.
  if (refused && refused.forceable === true) {
    out.push(h("button", {
      class: "btn quiet", type: "button", disabled: locked, "data-focus-key": "r:" + r.id + ":force", title: str(refused.reason), text: "Post anyway",
      onclick: () => {
        const b = buttons.find((x) => x.id === rec.lastButton) || buttons[0];
        state.confirming.set(id, "r:" + r.id + ":" + b.id + "!force");
        state.notes.delete(id);
        render();
      },
    }));
  }
  return out;
}

// The one actor of a card, or null when its buttons act as different people
function cardActor(d, r) {
  const actors = new Set(routeButtons(d, r).map((b) => b.actor));
  return actors.size === 1 ? [...actors][0] : null;
}

function buildCard(id, d, r, rec) {
  const p = paramsOf(r);
  const finding = (Array.isArray(d.findings) ? d.findings : []).find((f) => f && f.routeId === r.id) || null;
  const compact = routeCompact(r);
  rec.ta = null;
  rec.titleInput = null;
  rec.revealBox = null;
  rec.compact = compact;
  rec.card.className = "card intent-" + routeIntent(r) + (compact ? " compact" : "");
  rec.actions = h("div", { class: "card-actions" });
  rec.status = h("div", { class: "z-status" });
  const callout = str(r.callout) ? h("div", { class: "callout" + (r.type === "take_over" && p.mode === "replace" ? " strong" : "") }, icon("alert"), h("span", null, richText(r.callout))) : null;
  rec.dismissBox = buildDismissBox(id, r, rec);
  const dismissX = h("button", {
    class: "card-x", type: "button", "data-focus-key": "r:" + r.id + ":dismiss", "aria-label": "Not this suggestion", title: "Not this suggestion",
    onclick: () => {
      rec.dismissOpen = !rec.dismissOpen;
      rec.dismissBox.hidden = !rec.dismissOpen;
      if (rec.dismissOpen) rec.dismissInput.focus();
    },
  }, icon("x"));
  if (compact) {
    rec.head = h("div", { class: "card-head" }, hintEl(str(r.title) || routeButtons(d, r)[0]?.label || r.type), rec.actions, dismissX);
    rec.body = null;
    rec.card.replaceChildren(...[rec.head, rec.dismissBox, callout, rec.status].filter(Boolean));
    return;
  }
  const actor = cardActor(d, r);
  rec.headActor = actor ? actorMark(actor) : null;
  rec.head = h("button", {
    class: "card-head", type: "button", "data-focus-key": "card:" + r.id, "aria-expanded": "false",
    onclick: () => {
      detail.openRoute = detail.openRoute === r.id ? null : r.id;
      render();
    },
  }, hintEl(str(r.title) || routeButtons(d, r)[0]?.label || r.type), rec.headActor, icon("chevronDown", null, "chev"));
  rec.body = h("div", { class: "card-body" },
    str(r.why) ? h("p", { class: "card-why" }, richText(r.why)) : null,
    finding ? h("p", { class: "card-finding" }, h("span", { class: "vlabel sev-" + severityClass(finding.severity), text: str(finding.severity) || "note" }), " ", richText(finding.text)) : null,
    r.type === "take_over" && p.mode !== "replace" ? h("p", { class: "quiet-line", text: "Continues in the contributor's PR" }) : null,
    callout,
    r.type === "close" ? closeReasonBadge(d, r) : null,
    ...buildCardInputs(id, d, r, rec),
    rec.actions,
    rec.status);
  rec.card.replaceChildren(h("div", { class: "card-top" }, rec.head, dismissX), rec.dismissBox, rec.body);
}

// "Not this": an optional reason, then the server drops the route and the agent proposes another one
function buildDismissBox(id, r, rec) {
  rec.dismissInput = h("input", {
    type: "text", class: "field", "aria-label": "Why not? (optional)", placeholder: "Why not? (optional)",
    "data-focus-key": "r:" + r.id + ":dismiss-why", value: rec.dismissText || "",
  });
  rec.dismissInput.addEventListener("input", () => { rec.dismissText = rec.dismissInput.value; });
  return h("div", { class: "dismiss-box", hidden: !rec.dismissOpen },
    rec.dismissInput,
    h("div", { class: "dismiss-actions" },
      h("button", {
        class: "btn quiet", type: "button", "data-focus-key": "r:" + r.id + ":dismiss-send", text: "Dismiss suggestion",
        onclick: () => dismissRoute(id, r, rec.dismissInput.value.trim()),
      }),
      h("button", {
        class: "btn quiet", type: "button", "data-focus-key": "r:" + r.id + ":dismiss-cancel", text: "Cancel",
        onclick: () => {
          rec.dismissOpen = false;
          rec.dismissBox.hidden = true;
        },
      })));
}

async function dismissRoute(id, r, reason) {
  if (state.busy.has(id)) return;
  detail.lastZone = "route";
  detail.lastRoute = r.id;
  state.notes.delete(id);
  state.busy.add(id);
  render();
  try {
    if (!state.mcp) throw Object.assign(new Error("No server"), { code: "server_not_connected" });
    await state.mcp.callTool(SERVER, "dismiss_route", { itemId: id, routeId: r.id, text: reason });
    // Hide the card until the server pushes the item without it
    detail.dismissed.add(r.id);
    const d = state.items.get(id);
    if (d && !routesOf(d).some((x) => !detail.dismissed.has(x.id))) {
      // The item leaves the board with its last route, so the dialog says why before it closes
      detail.farewell = true;
      setTimeout(() => {
        if (detail.id === id && detail.farewell) closeDetail();
      }, 2500);
    }
  } catch (e) {
    state.notes.set(id, { kind: "failed", text: routeFailure(e, r) });
  } finally {
    state.busy.delete(id);
    render();
  }
}

// One card per route. The recommended route starts expanded, the others are one line until clicked.
function renderRoutes(id, d, locked) {
  if (detail.farewell) {
    placeChildren(detail.routes, [h("p", { class: "farewell", text: "Suggestion dismissed. The agent will propose something else." })]);
    return;
  }
  const routes = routesOf(d).filter((r) => !detail.dismissed.has(r.id));
  if (detail.openRoute === undefined || (detail.openRoute !== null && !routes.some((r) => r.id === detail.openRoute))) {
    const done = routes.find((r) => r.done && !routeCompact(r));
    const rec = recommendedRoute(d);
    detail.openRoute = (done || (rec && !routeCompact(rec) ? rec : null) || {}).id ?? null;
  }
  const keep = new Set(routes.map((r) => r.id));
  for (const k of [...detail.cards.keys()]) if (!keep.has(k)) detail.cards.delete(k);
  const nodes = routes.map((r) => {
    let rec = detail.cards.get(r.id);
    if (!rec) {
      rec = { card: h("section", { class: "card" }), checks: new Map(), decisions: new Map(), core: null, sig: null, revealed: false, rounds: null };
      detail.cards.set(r.id, rec);
    }
    // Rebuild the card only when the route itself changed. A new draft text alone updates the editor in place,
    // and never while he is typing in it, so focus, cursor and typed text stay.
    const { done, refused, text, draftHash, ...core } = r;
    const coreSig = JSON.stringify([core, hasText(r), d.threads, d.findings, d.kind, d.url]);
    if (coreSig !== rec.core) {
      rec.core = coreSig;
      rec.sig = null;
      buildCard(id, d, r, rec);
    } else if (rec.ta && !state.drafts.has(draftKey(id, "r:" + r.id)) && document.activeElement !== rec.ta && rec.ta.value !== str(text)) {
      rec.ta.value = str(text);
    }
    const open = !rec.compact && detail.openRoute === r.id;
    rec.card.classList.toggle("open", open);
    rec.card.classList.toggle("recommended", r.recommended === true);
    if (!rec.compact) {
      rec.head.setAttribute("aria-expanded", open ? "true" : "false");
      rec.body.hidden = !open;
      if (rec.headActor) rec.headActor.style.display = open ? "none" : "";
    }
    if (rec.ta) rec.ta.disabled = locked || !!r.done;
    const sig = JSON.stringify([r.done, r.refused, state.confirming.get(id), locked, isClosedThread(id, d), openedToday(id, r),
      detail.meNotes.get(r.id), detail.lastRoute === r.id ? state.notes.get(id) : null, str(boardCap.me && boardCap.me.login)]);
    if (sig !== rec.sig) {
      rec.sig = sig;
      rec.actions.replaceChildren(...buildCardActions(id, d, r, rec, locked));
    }
    if (open && rec.ta && !rec.ta.hidden) grow(rec.ta);
    return rec.card;
  });
  placeChildren(detail.routes, nodes);
}

// Place children in order, moving only nodes that are out of place, so a focused field stays attached
function placeChildren(box, nodes) {
  nodes.forEach((n, i) => {
    if (box.children[i] !== n) box.insertBefore(n, box.children[i] || null);
  });
  while (box.children.length > nodes.length) box.lastElementChild.remove();
}

// What the agent did while driving a PR. Open points stay visible, the rounds fold away.
function renderRounds(d) {
  const rounds = (Array.isArray(d.rounds) ? d.rounds : []).filter((x) => x && typeof x === "object");
  detail.rounds.hidden = rounds.length === 0;
  if (!rounds.length) {
    detail.rounds.replaceChildren();
    return;
  }
  const list = (v) => (Array.isArray(v) ? v : []);
  const last = rounds[rounds.length - 1];
  const open = list(last.open).map(str).filter(Boolean);
  const fixed = rounds.reduce((n, x) => n + list(x.fixed).length, 0);
  const dismissed = rounds.reduce((n, x) => n + list(x.dismissed).length, 0);
  const summary = rounds.length + (rounds.length === 1 ? " round" : " rounds") + " by the agent · " + fixed + " fixed · " + dismissed + " dismissed";
  const details = h("details", { class: "rounds-all" }, h("summary", null, summary),
    h("ol", { class: "rounds-list" }, rounds.map((x, i) => h("li", null,
      h("span", { class: "round-n", text: "Round " + (Number.isInteger(x.n) ? x.n : i + 1) }),
      list(x.fixed).length ? h("ul", null, list(x.fixed).map((t) => h("li", { class: "r-fixed" }, h("span", { class: "vlabel v-valid", text: "fixed" }), " ", richText(str(t))))) : null,
      list(x.dismissed).length ? h("ul", null, list(x.dismissed).map((t) => h("li", { class: "r-dismissed" },
        h("span", { class: "vlabel v-wrong", text: "dismissed" }), " ", richText(str(t && t.summary)),
        t && str(t.reason) ? h("span", { class: "t-note" }, " · ", richText(t.reason)) : null))) : null,
      list(x.open).length ? h("ul", null, list(x.open).map((t) => h("li", null, h("span", { class: "vlabel v-unjudged", text: "open" }), " ", richText(str(t))))) : null))));
  detail.rounds.replaceChildren(
    open.length ? h("div", { class: "rounds-open" }, h("span", { class: "card-label", text: "Still open after the agent's last round" }),
      h("ul", null, open.map((t) => h("li", null, richText(t))))) : null,
    details);
}

function renderZones(id, d, locked) {
  renderRoutes(id, d, locked);
  updateFooter(d, locked);
}

// The footer: Snooze, hide until new activity, and Analyze again with its note panel. Built once per opened item.
function buildZoneControls(id) {
  const leave = async (action, params) => {
    detail.lastZone = "away";
    await runAction(id, action, params, "", "more:" + action);
    if (detail.id === id && !state.notes.has(id)) closeDetail();
  };

  const reKey = "more:reanalyze";
  const note = h("textarea", {
    class: "short", id: "re-" + id, rows: "3", "data-focus-key": draftKey(id, reKey),
    placeholder: "Optional instructions, like which log or comment to look at again",
    value: getDraft(id, reKey, ""),
  });
  note.addEventListener("input", () => state.drafts.set(draftKey(id, reKey), note.value));
  const setPanel = (open) => {
    detail.analyze.hidden = !open;
    analyze.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) note.focus();
  };
  const send = h("button", {
    class: "btn intent-agent", type: "button", "data-focus-key": "more:send", title: "The agent does this",
    onclick: async () => {
      detail.lastZone = "agent";
      await runAction(id, "reanalyze", {}, note.value.trim(), reKey);
      if (detail.id === id && state.notes.get(id)?.kind !== "failed") setPanel(false);
    },
  }, actorMark("agent"), "Send to the agent");
  const cancel = h("button", { class: "btn quiet", type: "button", "data-focus-key": "more:cancel", text: "Cancel", onclick: () => setPanel(false) });
  detail.analyze.replaceChildren(
    h("label", { class: "card-label", for: note.id }, "Analyze again"),
    note,
    h("div", { class: "card-actions" }, send, cancel));
  detail.analyze.hidden = true;

  const fbtn = (content, label, key, fn, tip = label) => h("button", {
    class: "foot-btn", type: "button", "data-focus-key": key, "aria-label": label, title: tip, "data-tip": tip, onclick: fn,
  }, content);
  const snoozeBtn = (n) => fbtn(n + "d", "Snooze " + n + (n === 1 ? " day" : " days"), "foot:snooze:" + n, () => leave("snooze", { days: n }));
  const snoozes = [1, 3, 7].map(snoozeBtn);
  const dismiss = fbtn("until new activity", "Snooze until new activity", "foot:dismiss", () => leave("dismiss", {}),
    "Hidden until someone comments or pushes on GitHub");
  const restore = fbtn("Show again", "Show again", "foot:restore", () => {
    detail.lastZone = "away";
    restoreItem(id);
  });
  const analyze = fbtn([icon("sparkles"), "Analyze again"], "Analyze again", "foot:analyze", () => setPanel(detail.analyze.hidden),
    "Ask the agent to look at this item again");
  analyze.classList.add("foot-analyze");
  analyze.setAttribute("aria-expanded", "false");
  analyze.setAttribute("aria-controls", "d-analyze");
  const status = h("div", { class: "foot-status" });
  detail.foot.replaceChildren(
    status,
    h("span", { class: "foot-label" }, icon("moon"), "Snooze"), ...snoozes, dismiss, restore, analyze,
  );
  return { review: send, input: note, inputDraft: draftKey(id, reKey), snoozes, dismiss, restore, analyze, status };
}

function updateFooter(d, locked) {
  const zc = detail.zoneCtl;
  if (!zc) return;
  for (const c of [zc.review, zc.input, zc.analyze, ...zc.snoozes, zc.dismiss, zc.restore]) c.disabled = locked;
  zc.restore.hidden = !isHiddenItem(d);
  zc.dismiss.hidden = d.hidden === true;
  // A sent instruction clears its draft, so the note empties as well
  if (!state.drafts.has(zc.inputDraft) && document.activeElement !== zc.input && zc.input.value !== "") zc.input.value = "";
}

// Route results show on their card. Everything else, including agent requests, shows in the footer.
function renderZoneStatus(id) {
  const zc = detail.zoneCtl;
  const busyOrNote = state.busy.has(id) || state.notes.has(id);
  if (busyOrNote && detail.lastZone === "route") {
    if (zc) zc.status.replaceChildren();
    const rec = detail.cards.get(detail.lastRoute);
    for (const [rid, other] of detail.cards) if (rid !== detail.lastRoute) other.status.replaceChildren();
    if (rec) {
      const line = state.busy.has(id) ? h("div", { class: "status running" }, icon("send"), h("span", { text: "Sending to the board server" }))
        : state.notes.get(id).kind === "failed" ? h("div", { class: "status failed" }, icon("alert"), h("span", { text: state.notes.get(id).text })) : null;
      rec.status.replaceChildren(...(line ? [line] : []));
    }
    return;
  }
  for (const rec of detail.cards.values()) rec.status.replaceChildren();
  const line = statusLine(id);
  if (zc) zc.status.replaceChildren(...(line ? [line] : []));
}

function findFocusable(key) {
  const all = [...detail.el.querySelectorAll("[data-focus-key], [data-focus-alt]")];
  return all.find((e) => e.dataset.focusKey === key) || all.find((e) => e.dataset.focusAlt === key) || null;
}

function currentFocusKey() {
  const a = document.activeElement;
  if (a && a !== detail.body && detail.el.contains(a)) return (a.dataset && a.dataset.focusKey) || null;
  return detail.pendingFocus;
}

// Rebuilt or disabled controls drop focus, so move it to the control with the same key once that one is usable
function restoreDetailFocus(key) {
  detail.pendingFocus = null;
  if (key) {
    const t = findFocusable(key);
    if (t && !t.disabled && !t.hidden) {
      if (document.activeElement !== t) t.focus({ preventScroll: true });
    } else {
      detail.pendingFocus = key;
    }
  }
  const a = document.activeElement;
  if (!a || !detail.el.contains(a) || a.disabled) detail.body.focus({ preventScroll: true });
}

function renderDetail() {
  const id = detail.id;
  if (!id) return;
  const d = state.items.get(id);
  if (!d) {
    // After the last route was dismissed the dialog keeps its note on screen until its timer closes it
    if (detail.farewell) return;
    closeDetail();
    return;
  }
  const open = detail.el.open;
  const focusKey = open ? currentFocusKey() : null;
  const scrollTop = detail.body.scrollTop;
  const dim = isHiddenItem(d);
  const locked = state.busy.has(id) || state.dbMissing;

  if (partChanged("head", [d, dim, state.latestAction.get(id)])) renderDetailHead(d, dim);
  if (partChanged("info", [d])) renderDetailInfo(d);
  renderZones(id, d, locked);
  if (partChanged("status", [state.latestAction.get(id), state.busy.has(id), state.notes.get(id), detail.lastZone])) renderZoneStatus(id);

  if (open) {
    detail.body.scrollTop = scrollTop;
    restoreDetailFocus(focusKey);
  }
}

function openDetail(id, row) {
  if (!state.items.has(id) || detail.el.open) return;
  const rows = visibleRows();
  detail.rowIndex = row ? rows.indexOf(row) : rows.findIndex((r) => r.dataset.id === id);
  detail.rowSlot = row ? row.dataset.slot : null;
  detail.id = id;
  detail.deps.clear();
  detail.cards.clear();
  detail.dismissed.clear();
  detail.farewell = false;
  detail.routes.replaceChildren();
  detail.openRoute = undefined;
  detail.lastRoute = null;
  detail.threadsOpen = false;
  detail.meNotes.clear();
  detail.lastZone = null;
  detail.findingsOpen = null;
  detail.pendingFocus = null;
  detail.zoneCtl = buildZoneControls(id);
  renderDetail();
  detail.el.showModal();
  for (const rec of detail.cards.values()) if (rec.ta && !rec.body.hidden) grow(rec.ta);
  detail.body.scrollTop = 0;
  detail.body.focus({ preventScroll: true });
}

// Run the cleanup right away because the close event fires in a later task
function closeDetail() {
  if (detail.el.open) detail.el.close();
  finishDetail();
}

// ---------- learning from his decisions ----------

// The board server's own helper object, kept as it came, so methods the server adds stay callable
let boardApi = null;

// Tells the server which prefill he used and with what text. It must never get in the way of the click.
function postDecision(body) {
  try {
    const send = boardApi && boardApi.decision;
    if (typeof send === "function") Promise.resolve(send.call(boardApi, body)).catch(() => {});
  } catch {
    // Nothing to report: the decision only feeds suggestions
  }
}

const learn = {
  el: document.getElementById("learn-dialog"),
  cards: document.getElementById("learn-cards"),
  empty: document.getElementById("learn-empty"),
  btn: document.getElementById("learn"),
  recs: new Map(),
  added: new Map(),
  gone: new Set(),
  busy: new Set(),
};

function openProposals() {
  return state.proposals.filter((p) => !learn.gone.has(p.id));
}

function proposalTarget(p) {
  // The heading arrives as markdown, like "## Stale PRs"
  const heading = str(p.heading).replace(/^#+\s*/, "").trim();
  const under = heading ? " under “" + heading + "”" : "";
  return p.target === "personal" ? "Adds to your personal rules" + under : "Adds to " + str(p.file) + under + " in the project profile";
}

function proposalAdded(p) {
  return p.target === "personal" ? "Added to your personal rules" : "Added to " + str(p.file);
}

function evidenceLine(e) {
  const itemId = str(e.itemId);
  const num = "#" + (itemId.split("-").pop() || "?");
  const at = Date.parse(str(e.at));
  const day = Number.isFinite(at) ? new Date(at).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  const ref = state.items.has(itemId)
    ? h("button", {
      type: "button", class: "lane-switch ev-link", text: num, title: "Open " + num,
      onclick: () => {
        learn.el.close();
        openDetail(itemId);
      },
    })
    : h("span", { class: "ev-ref", text: num });
  return h("li", null,
    day ? h("span", { class: "ev-day", text: day }) : null,
    ref,
    str(e.type) ? h("span", { class: "vlabel v-wrong", text: str(e.type).replace(/_/g, " ") }) : null,
    h("span", { class: "ev-gist" }, richText(str(e.gist))));
}

async function proposalAction(p, rec, action, text) {
  if (learn.busy.has(p.id)) return;
  learn.busy.add(p.id);
  rec.status.replaceChildren(h("div", { class: "status running" }, icon("send"), h("span", { text: "Sending to the board server" })));
  try {
    if (!state.mcp) throw Object.assign(new Error("No server"), { code: "server_not_connected" });
    await state.mcp.callTool(SERVER, action, { proposalId: p.id, text });
    if (action === "accept_proposal") learn.added.set(p.id, proposalAdded(p));
    else learn.gone.add(p.id);
    rec.sig = null;
  } catch (e) {
    rec.status.replaceChildren(h("div", { class: "status failed" }, icon("alert"), h("span", { text: routeFailure(e, { type: "chore" }) })));
  } finally {
    learn.busy.delete(p.id);
    renderLearn();
  }
}

function buildProposal(p, rec) {
  const evidence = (Array.isArray(p.evidence) ? p.evidence : []).filter((e) => e && typeof e === "object");
  rec.ta = h("textarea", { class: "short", "aria-label": "Rule text", value: rec.draft ?? str(p.text) });
  rec.ta.addEventListener("input", () => { rec.draft = rec.ta.value; });
  rec.status = h("div", { class: "z-status" });
  rec.actions = h("div", { class: "card-actions" });
  const why = h("input", { type: "text", class: "field", placeholder: "Why not? (optional)", "aria-label": "Why not? (optional)" });
  rec.dismissBox = h("div", { class: "dismiss-box", hidden: true }, why,
    h("div", { class: "dismiss-actions" },
      h("button", { class: "btn quiet", type: "button", text: "Dismiss suggestion", onclick: () => proposalAction(p, rec, "dismiss_proposal", why.value.trim()) }),
      h("button", { class: "btn quiet", type: "button", text: "Cancel", onclick: () => { rec.dismissBox.hidden = true; } })));
  rec.card.replaceChildren(
    h("div", { class: "card-head" }, h("span", { class: "p-title", text: str(p.title) })),
    h("div", { class: "card-body" },
      str(p.why) ? h("p", { class: "card-why" }, richText(p.why)) : null,
      evidence.length ? h("details", { class: "evidence" },
        h("summary", null, "Based on " + evidence.length + (evidence.length === 1 ? " decision" : " decisions")),
        h("ul", null, evidence.map(evidenceLine))) : null,
      h("p", { class: "quiet-line", text: proposalTarget(p) }),
      h("label", { class: "card-label", text: "Rule" }),
      rec.ta,
      rec.actions,
      rec.dismissBox,
      rec.status));
}

function proposalButtons(p, rec) {
  if (learn.added.has(p.id)) {
    return [h("span", { class: "status done step-done" }, icon("doneCheck"), h("span", { text: learn.added.get(p.id) }))];
  }
  return [
    h("button", { class: "btn intent-think primary", type: "button", text: "Add rule", onclick: () => proposalAction(p, rec, "accept_proposal", rec.ta.value) }),
    h("button", { class: "btn quiet", type: "button", text: "Not this", onclick: () => { rec.dismissBox.hidden = false; rec.dismissBox.querySelector("input").focus(); } }),
  ];
}

function renderLearn() {
  const list = openProposals();
  const waiting = list.filter((p) => !learn.added.has(p.id)).length;
  learn.btn.hidden = waiting === 0;
  learn.btn.replaceChildren(icon("lightbulb"), h("span", { class: "learn-count", text: String(waiting) }));
  const label = waiting === 1 ? "1 suggested rule" : waiting + " suggested rules";
  learn.btn.setAttribute("aria-label", label);
  learn.btn.title = label;
  if (!learn.el.open) return;
  const keep = new Set(list.map((p) => p.id));
  for (const k of [...learn.recs.keys()]) if (!keep.has(k)) learn.recs.delete(k);
  const nodes = list.map((p) => {
    let rec = learn.recs.get(p.id);
    if (!rec) {
      rec = { card: h("section", { class: "card open intent-think pcard" }), core: null, sig: null, draft: null };
      learn.recs.set(p.id, rec);
    }
    const core = JSON.stringify(p);
    if (core !== rec.core) {
      rec.core = core;
      rec.sig = null;
      buildProposal(p, rec);
    }
    const sig = JSON.stringify([learn.added.get(p.id), learn.busy.has(p.id)]);
    if (sig !== rec.sig) {
      rec.sig = sig;
      rec.actions.replaceChildren(...proposalButtons(p, rec));
      if (learn.added.has(p.id)) {
        rec.ta.disabled = true;
        rec.dismissBox.hidden = true;
      }
    }
    return rec.card;
  });
  placeChildren(learn.cards, nodes);
  learn.empty.hidden = nodes.length > 0;
}

function setupLearn() {
  learn.btn.addEventListener("click", () => {
    learn.el.showModal();
    renderLearn();
  });
  const close = document.getElementById("learn-close");
  close.append(icon("x", null, "lg"));
  close.addEventListener("click", () => learn.el.close());
  learn.el.addEventListener("click", (e) => {
    if (e.target !== learn.el) return;
    const r = learn.el.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) learn.el.close();
  });
  learn.el.addEventListener("close", () => {
    // Added cards stay until the next open, so he sees the result, then they make room
    for (const id of learn.added.keys()) learn.gone.add(id);
    learn.recs.clear();
    renderLearn();
  });
}

// ---------- page reload ----------

let reloadPending = false;

// The local server announces a new board page. Typed step texts are saved, so only an open dialog defers the reload.
function requestReload() {
  if (!detail.el.open) {
    location.reload();
    return;
  }
  reloadPending = true;
  document.getElementById("reload").hidden = false;
}

window.addEventListener("board:reload", requestReload);
document.getElementById("reload").addEventListener("click", () => location.reload());

function finishDetail() {
  const id = detail.id;
  // A close event can arrive after the dialog was opened again, and must not clear the new item
  if (!id || detail.el.open) return;
  detail.id = null;
  state.confirming.delete(id);
  detail.cards.clear();
  detail.dismissed.clear();
  detail.farewell = false;
  detail.routes.replaceChildren();
  detail.deps.clear();
  detail.zoneCtl = null;
  detail.foot.replaceChildren();
  detail.pendingFocus = null;
  const rows = visibleRows();
  const same = rows.filter((r) => r.dataset.id === id);
  const back = same.find((r) => r.dataset.slot === detail.rowSlot) || same[0] || rows[Math.min(detail.rowIndex, rows.length - 1)];
  if (back) back.focus();
  if (reloadPending) location.reload();
}

function setupDetail() {
  const el = detail.el;
  const closeBtn = document.getElementById("d-close");
  closeBtn.append(icon("x", null, "lg"));
  closeBtn.addEventListener("click", closeDetail);

  const onBackdrop = (e) => {
    if (e.target !== el) return false;
    const r = el.getBoundingClientRect();
    return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  };
  // Require press and release outside the dialog so a text selection dragged past the edge keeps it open
  let pressedOutside = false;
  el.addEventListener("pointerdown", (e) => { pressedOutside = onBackdrop(e); });
  el.addEventListener("click", (e) => {
    if (pressedOutside && onBackdrop(e)) closeDetail();
    pressedOutside = false;
  });

  el.addEventListener("close", finishDetail);
}

function setupRowKeys() {
  document.addEventListener("keydown", (e) => {
    if (detail.el.open || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (t instanceof Element && t.closest("input, textarea, select, [contenteditable]")) return;
    const onRow = t instanceof Element && t.classList.contains("row");
    let dir = 0;
    if (e.key === "j" || (onRow && e.key === "ArrowDown")) dir = 1;
    else if (e.key === "k" || (onRow && e.key === "ArrowUp")) dir = -1;
    if (!dir) return;
    const rows = visibleRows();
    if (!rows.length) return;
    const i = rows.indexOf(t);
    const next = i < 0 ? rows[dir > 0 ? 0 : rows.length - 1] : rows[Math.max(0, Math.min(rows.length - 1, i + dir))];
    e.preventDefault();
    next.focus({ preventScroll: true });
    next.scrollIntoView({ block: "nearest" });
  });
}

// ---------- actions ----------

function errorText(e) {
  return str(e && (e.message || e.code)) || "Unknown error";
}

async function writeActionLog(itemId, action, params, text, status, via, result) {
  const id = itemId + "-" + Date.now();
  const createdAt = nowIso();
  const doc = {
    itemId,
    action,
    params: params && typeof params === "object" ? params : {},
    text: str(text),
    status,
    via,
    createdAt,
    finishedAt: status === "queued" ? null : createdAt,
    result: str(result),
  };
  await state.db.doc("actions/" + id).set(doc);
}

function resultString(r) {
  if (r == null) return "";
  if (typeof r === "string") return r;
  if (typeof r === "object") {
    if (typeof r.url === "string") return r.url;
    if (typeof r.message === "string") return r.message;
  }
  try { return JSON.stringify(r).slice(0, 500); } catch { return String(r); }
}

function parseToolPayload(p) {
  if (typeof p === "string") {
    try { p = JSON.parse(p); } catch { return null; }
  }
  return p && typeof p === "object" && typeof p.ok === "boolean" ? p : null;
}

async function runAction(itemId, action, rawParams, text, stepKey) {
  const item = state.items.get(itemId);
  if (!item || !state.db || state.busy.has(itemId)) return;
  const params = rawParams && typeof rawParams === "object" && !Array.isArray(rawParams) ? JSON.parse(JSON.stringify(rawParams)) : {};
  state.notes.delete(itemId);
  state.busy.add(itemId);
  render();

  try {
    if (BOARD_ACTIONS.has(action)) {
      await runBoardAction(itemId, action, params);
    } else if (AGENT_ACTIONS.has(action)) {
      await writeActionLog(itemId, action, params, text, "queued", "queue", "");
      state.drafts.delete(draftKey(itemId, stepKey));
    } else {
      state.notes.set(itemId, { kind: "failed", text: "The board does not know the action \"" + action + "\"." });
    }
  } catch (e) {
    state.notes.set(itemId, { kind: "failed", text: "Saving failed: " + errorText(e) });
  } finally {
    state.busy.delete(itemId);
    render();
  }
}

async function runBoardAction(itemId, action, params) {
  const ref = state.db.doc("items/" + itemId);
  if (action === "dismiss") {
    await ref.update({ hidden: true });
  } else if (action === "snooze") {
    const days = Number.isInteger(params.days) && params.days >= 1 && params.days <= 90 ? params.days : 1;
    await ref.update({ snoozedUntil: new Date(Date.now() + days * 86400000).toISOString() });
  }
  await writeActionLog(itemId, action, params, "", "done", "board", "");
}

async function restoreItem(itemId) {
  if (!state.db || state.busy.has(itemId)) return;
  state.busy.add(itemId);
  render();
  try {
    await state.db.doc("items/" + itemId).update({ hidden: false, snoozedUntil: null });
  } catch (e) {
    state.notes.set(itemId, { kind: "failed", text: "Restoring failed: " + errorText(e) });
  } finally {
    state.busy.delete(itemId);
    render();
  }
}

// ---------- data ----------

function onDbError(e) {
  state.loadError = e && e.code === "revoked" ? "Access to the board data ended." : "Error: " + errorText(e) + ".";
  clearTimeout(slowTimer);
  render();
}

let slowTimer = 0;
const confirmed = { items: false, actions: false, meta: false };

function markLoaded(key, meta) {
  state.loaded[key] = true;
  if (meta && !meta.fromCache) confirmed[key] = true;
  if (confirmed.items && confirmed.actions && confirmed.meta) {
    clearTimeout(slowTimer);
    state.slow = false;
  }
}

function subscribe(db) {
  slowTimer = setTimeout(() => { state.slow = true; render(); }, 10000);

  db.collection("items").onSnapshot((snap) => {
    const next = new Map();
    for (const doc of snap.docs) {
      const d = doc.data();
      // Nothing to do means not on the list: the routine analyzes such items itself or waits for GitHub
      if (d && typeof d === "object" && routesOf(d).length) next.set(doc.id, d);
    }
    state.items = next;
    for (const id of state.confirming.keys()) if (!next.has(id)) state.confirming.delete(id);
    markLoaded("items", snap.metadata);
    render();
  }, onDbError);

  db.collection("actions").orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => {
    const latest = new Map();
    for (const doc of snap.docs) {
      const a = doc.data();
      if (!a || typeof a.itemId !== "string") continue;
      const prev = latest.get(a.itemId);
      if (!prev || str(a.createdAt) > str(prev.createdAt)) latest.set(a.itemId, a);
    }
    state.latestAction = latest;
    markLoaded("actions", snap.metadata);
    render();
  }, onDbError);

  // Rule proposals are their own collection. A server without them leaves the header entry hidden.
  try {
    db.collection("proposals").onSnapshot((snap) => {
      state.proposals = snap.docs.map((doc) => ({ ...doc.data(), id: doc.id })).filter((x) => x && typeof x.title === "string");
      renderLearn();
    }, () => {});
  } catch {
    state.proposals = [];
  }

  db.doc("meta/status").onSnapshot((snap) => {
    state.meta = snap.exists ? snap.data() : null;
    markLoaded("meta", snap.metadata);
    render();
  }, onDbError);
}

async function checkServer() {
  if (!state.mcp) return setServer("queued");
  try {
    const r = await state.mcp.listTools(SERVER);
    const s = r && Array.isArray(r.servers) ? r.servers.find((x) => x && x.server === SERVER) : null;
    setServer(s && Array.isArray(s.tools) && s.tools.length ? "connected" : "queued");
  } catch {
    setServer("queued");
  }
}

async function boot() {
  const claude = window.claude;
  const use = claude && typeof claude.use === "function" ? (n) => claude.use(n).catch(() => null) : async () => null;
  // The project info names the storage keys, so it comes before the saved filters
  boardApi = await use("board");
  applyBoardInfo(boardApi);
  setupLearn();
  state.filters = loadFilters();
  buildFilters();
  setupDetail();
  setupRowKeys();
  buildSections();
  els.board.append(planEls.el, ...GROUPS.map((g) => groupEls.get(g.id).el));
  renderConnection();
  render();

  const [db, mcp] = await Promise.all([use("db"), use("mcp")]);

  state.mcp = mcp;
  checkServer();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkServer();
  });

  if (!db) {
    state.dbMissing = true;
    state.loaded = { items: true, actions: true, meta: true };
    render();
    return;
  }
  state.db = db;
  subscribe(db);
}

setInterval(() => {
  refreshTimes();
  // Snoozes expire with the clock, so visibility must be recomputed
  render();
}, 60000);

boot();
</script>
