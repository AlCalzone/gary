<style>
/* Layout: a quiet header, then one bordered block per section with its own header band; rows are single lines that end in state icons, the effort figure and the age */
:root {
  --tint: 5%;
  --bg: #edf0f7;
  --surface: #fcfcfe;
  --surface-2: #f3f4fa;
  --today: #eef3fd;
  --today-line: #d8e1f6;
  --today-hover: #e5ecfb;
  --fg: #1d2030;
  --muted: #525a72;
  --faint: #636a80;
  --line: #e2e5f0;
  --line-strong: #cfd4e3;
  --accent: #4560c4;
  --accent-fg: #ffffff;
  --accent-soft: #e3e9fb;
  --bar-track: #dce4f7;
  --bar: #6680d6;
  --violet: #7652c4;
  --act-finish: #23704b;
  --act-close: #b23a34;
  --act-talk: #2d5bb5;
  --act-push: #85560a;
  --act-think: #8a3aa8;
  --act-agent: #1b6b6e;
  --code-bg: #eceef5;
  --act-away: #5a6175;
  --cat-active: #fbe3d8;
  --cat-easy: #dcf1e4;
  --cat-almost: #f9eec8;
  --cat-review: #e5e1fa;
  --cat-deferred: #dfebf7;
  --cat-hardware: #eee4d8;
  --cat-snoozed: #e9e9f1;
  --ok: #2a7a52;
  --ok-soft: #e0f2e8;
  --warn: #8f5d0c;
  --warn-soft: #f8ecd6;
  --bad: #b23a32;
  --bad-soft: #fbe4e1;
  --focus: #4560c4;
  --backdrop: rgba(30, 36, 60, 0.38);
  --shadow: rgba(40, 50, 90, 0.14);
  --font-body: "Instrument Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --r: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tint: 8%;
    --bg: #11131b;
    --surface: #191c27;
    --surface-2: #202432;
    --today: #1b2235;
    --today-line: #2c3654;
    --today-hover: #222a42;
    --fg: #e8eaf2;
    --muted: #a6adc2;
    --faint: #878ea3;
    --line: #2a2f3f;
    --line-strong: #383e52;
    --accent: #a2b5ff;
    --accent-fg: #11131b;
    --accent-soft: #27304d;
    --bar-track: #2a3250;
    --bar: #a2b5ff;
    --violet: #c3b0f5;
    --act-finish: #8fd4ae;
    --act-close: #f3a39a;
    --act-talk: #9ab8ff;
    --act-push: #efc27c;
    --act-think: #dda6f2;
    --act-agent: #7fd0c9;
    --code-bg: #272c3b;
    --act-away: #a6adc2;
    --cat-active: #42302a;
    --cat-easy: #22392c;
    --cat-almost: #3d3622;
    --cat-review: #312c4f;
    --cat-deferred: #223446;
    --cat-hardware: #3a3129;
    --cat-snoozed: #2b2c38;
    --ok: #8fd4ae;
    --ok-soft: #1d3529;
    --warn: #efc27c;
    --warn-soft: #3a2f1a;
    --bad: #f3a39a;
    --bad-soft: #3d2226;
    --focus: #a2b5ff;
    --backdrop: rgba(5, 6, 12, 0.62);
    --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tint: 8%;
  --bg: #11131b;
  --surface: #191c27;
  --surface-2: #202432;
  --today: #1b2235;
  --today-line: #2c3654;
  --today-hover: #222a42;
  --fg: #e8eaf2;
  --muted: #a6adc2;
  --faint: #878ea3;
  --line: #2a2f3f;
  --line-strong: #383e52;
  --accent: #a2b5ff;
  --accent-fg: #11131b;
  --accent-soft: #27304d;
  --bar-track: #2a3250;
  --bar: #a2b5ff;
  --violet: #c3b0f5;
  --act-finish: #8fd4ae;
  --act-close: #f3a39a;
  --act-talk: #9ab8ff;
  --act-push: #efc27c;
  --act-think: #dda6f2;
  --act-agent: #7fd0c9;
  --code-bg: #272c3b;
  --act-away: #a6adc2;
  --cat-active: #42302a;
  --cat-easy: #22392c;
  --cat-almost: #3d3622;
  --cat-review: #312c4f;
  --cat-deferred: #223446;
  --cat-hardware: #3a3129;
  --cat-snoozed: #2b2c38;
  --ok: #8fd4ae;
  --ok-soft: #1d3529;
  --warn: #efc27c;
  --warn-soft: #3a2f1a;
  --bad: #f3a39a;
  --bad-soft: #3d2226;
  --focus: #a2b5ff;
  --backdrop: rgba(5, 6, 12, 0.62);
  --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-body);
}
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.i { width: 16px; height: 16px; flex: none; display: block; }
.i.lg { width: 18px; height: 18px; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.muted { color: var(--muted); }
.accent { color: var(--accent); }
.violet { color: var(--violet); }
.faint { color: var(--faint); }
.neutral { color: var(--fg); }

/* Header */
header { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 14px; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.dry { font-size: 11.5px; font-weight: 600; color: var(--warn); padding: 1px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--warn); }
.dry[hidden] { display: none; }
.run { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.conn { margin-left: auto; display: inline-flex; padding: 4px; color: var(--faint); }
.conn[data-state="connected"] { color: var(--ok); }
.conn[data-state="queued"] { color: var(--warn); }
.controls { position: relative; }
.ctl-btn { margin-left: 0; color: var(--muted); }
.ctl-btn[aria-expanded="true"] { background: var(--surface); color: var(--fg); }
.fgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 500 13px/1 var(--font-body);
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.chip .i { width: 15px; height: 15px; }
.chip[aria-pressed="true"] { background: var(--surface); border-color: var(--surface); color: var(--fg); }
.search {
  width: 100%;
  font: inherit;
  font-size: 13.5px;
  padding: 7px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
}
.ctl-btn { position: relative; }
.ctl-btn[data-active="true"]::after {
  content: "";
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
}
.fpanel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 5;
  width: min(360px, calc(100vw - 32px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 14px 36px var(--shadow);
}
.fpanel .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--fg); }
.fpanel-group { display: flex; flex-direction: column; gap: 8px; }
.fpanel-label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; }

/* Notices */
.notice { padding: 16px 18px; border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--muted); background: var(--surface); }
.notice strong { color: var(--fg); font-weight: 600; display: block; margin-bottom: 2px; }

/* Sections */
#board { display: flex; flex-direction: column; gap: 20px; }
.section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.section h2 { font-size: 15.5px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
.sec-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  background: var(--surface-2);
}
.plan { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 2px 2px 4px; }
.plan .bar { margin-left: 0; flex: 1 1 160px; max-width: 320px; }
.plan .sum { margin-left: 0; }
.plan-done { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; color: var(--muted); font-size: 13px; }
.bar {
  height: 6px;
  border-radius: 999px;
  background: var(--bar-track);
  overflow: hidden;
}
.bar-fill { display: block; height: 100%; background: var(--bar); border-radius: inherit; }
.group-quick { background: var(--today); border-color: var(--today-line); }
.group-quick > .sec-head { background: transparent; }
.group-quick .row { border-top-color: var(--today-line); }
.group-quick .row:hover, .group-quick .row:focus-visible { background: var(--today-hover); }
.group > .sec-head { border-bottom: 1px solid var(--line); }
.group-quick > .sec-head { border-bottom-color: var(--today-line); }
.group > .sec-head h2 { font-size: 16px; }
.cat {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1;
  padding: 4px 8px;
  border-radius: 999px;
  color: var(--fg);
  white-space: nowrap;
}
.cat-active { background: var(--cat-active); }
.cat-easy { background: var(--cat-easy); }
.cat-almost { background: var(--cat-almost); }
.cat-review { background: var(--cat-review); }
.cat-deferred { background: var(--cat-deferred); }
.cat-hardware { background: var(--cat-hardware); }
.cat-snoozed { background: var(--cat-snoozed); }
.show-all { margin: 4px 10px 8px; }
.sum { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list { display: flex; flex-direction: column; }
.empty-section { color: var(--faint); font-size: 13px; padding: 14px 18px; }

/* Rows */
.row {
  display: grid;
  /* Fixed tracks only: every row is its own grid, so an auto track would sit at a different x per row */
  grid-template-columns: 16px 16px 3.3em 4.9em minmax(0, 1fr) 7.5em 3.4em 3.6em;
  grid-template-areas: "kind rev num cat main author effort age";
  grid-template-rows: var(--line-h) auto;
  align-items: start;
  justify-items: start;
  gap: 0 12px;
  --line-h: 22px;
  width: 100%;
  min-height: 50px;
  margin: 0;
  padding: 12px 18px;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row:focus-visible { outline-offset: -2px; background: var(--surface-2); }
.row.dim { opacity: 0.55; }
/* Every cell except the title block is one line tall, so it lines up with the first title line */
.r-kind, .r-rev, .r-num, .r-cat, .r-author, .r-effort, .r-age { height: var(--line-h); display: flex; align-items: center; }
.r-effort, .r-age { justify-self: stretch; }
.row .r-main { grid-row: 1 / span 2; justify-self: stretch; }
/* State icons sit on the second line, under the number and the chip */
.r-meta {
  grid-row: 2;
  grid-column: 3 / 5;
  justify-self: stretch;
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  padding-top: 5px;
  color: var(--muted);
}
.r-meta > * { flex: none; }
.r-meta .i { width: 14px; height: 14px; }
.r-kind { grid-area: kind; }
.r-rev { grid-area: rev; }
.r-cat { grid-area: cat; }
.r-main { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r-author, .d-author { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 12.5px; }
.r-author { grid-area: author; justify-self: stretch; overflow: hidden; }
.a-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface-2);
  box-shadow: 0 0 0 1px var(--line);
}
.avatar.ph { display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--muted); }
.avatar.ph::before { content: attr(data-letter); }
/* State badges in the dialog: lighter than the review badges, which are links */
.sbadge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 5px; border-radius: 6px; font-size: 12px; font-weight: 500; line-height: 1.4; }
.sbadge .i { width: 13px; height: 13px; }
.sbadge.tone-ok { background: var(--ok-soft); color: var(--ok); }
.sbadge.tone-bad { background: var(--bad-soft); color: var(--bad); }
.sbadge.tone-warn { background: var(--warn-soft); color: var(--warn); }
.sbadge.tone-muted, .sbadge.tone-faint { background: var(--surface-2); color: var(--muted); }
.kind-words { font-size: 12.5px; font-weight: 600; }
.kind-words.muted, .kind-words.neutral { color: var(--muted); }
/* Review badges and review threads */
.reviews { display: flex; flex-wrap: wrap; gap: 6px; }
.rv {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 4px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--fg);
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
}
a.rv:hover { border-color: var(--muted); text-decoration: none; }
.rv .avatar { width: 18px; height: 18px; }
.rv .i { width: 14px; height: 14px; }
.rv .rv-count { color: var(--muted); font-variant-numeric: tabular-nums; }
.rv-dismissed .rv-name { text-decoration: line-through; color: var(--muted); }
.rv-pending { border-style: dashed; color: var(--muted); }
.threads > summary { cursor: pointer; width: max-content; max-width: 100%; font-size: 13px; font-weight: 600; color: var(--muted); }
.threads .t-counts { font-weight: 500; color: var(--faint); margin-left: 6px; }
.threads ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.threads li { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.threads li .sev { justify-self: start; }
.t-summary { font-family: var(--font-read); font-size: 14.5px; line-height: 1.55; color: var(--fg); overflow-wrap: anywhere; }
.t-note { font-size: 13px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.t-ref { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.t-ref code { font-family: var(--font-mono); font-size: 11.5px; }
.r-hint {
  --act: var(--accent);
  display: flex;
  align-items: flex-start;
  gap: 5px;
  min-width: 0;
  font-size: 13px;
  line-height: 18px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.r-hint .i { width: 14px; height: 14px; margin-top: 2px; color: var(--act); }
.h-act { color: var(--act); font-weight: 500; }
.r-hint.act-finish { --act: var(--act-finish); }
.r-hint.act-close { --act: var(--act-close); }
.r-hint.act-talk { --act: var(--act-talk); }
.r-hint.act-push { --act: var(--act-push); }
.r-hint.act-think { --act: var(--act-think); }
.r-hint.act-agent { --act: var(--act-agent); }
.r-hint.act-away { --act: var(--act-away); }
.step-done { padding: 4px 0; }

/* Dialog zones: reading on the dialog surface, GitHub actions on a neutral panel, agent requests on a teal tint,
   board housekeeping in a pinned footer */
.d-support { display: flex; flex-direction: column; gap: 12px; padding-top: 2px; font-size: 13px; color: var(--muted); }
.d-support .fref { font-size: 11.5px; }
/* Route cards: the recommended way forward is open, the others are one line. Each card carries a soft tint of its intent. */
.ways { display: flex; flex-direction: column; gap: 10px; }
.routes { display: flex; flex-direction: column; gap: 8px; }
.card {
  --int: var(--accent);
  border: 1px solid color-mix(in srgb, var(--int) 20%, var(--line));
  border-radius: 12px;
  background: color-mix(in srgb, var(--int) var(--tint), var(--surface));
  min-width: 0;
}
.card.open { border-color: color-mix(in srgb, var(--int) 36%, var(--line)); box-shadow: 0 1px 2px var(--shadow); }
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 9px 14px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--fg);
  font: inherit;
  text-align: left;
}
button.card-head { cursor: pointer; }
button.card-head:hover { background: color-mix(in srgb, var(--int) calc(var(--tint) + 5%), var(--surface)); }
.card.open button.card-head { padding-bottom: 6px; border-radius: 12px 12px 0 0; }
.card-head .r-hint { flex: 1; font-size: 14px; line-height: 20px; }
.card.open .card-head .r-hint { font-size: 15px; }
.card-head > .avatar, .card-head > .actor-icon { width: 20px; height: 20px; flex: none; }
.card-top { display: flex; align-items: center; }
.card-top > .card-head { flex: 1; min-width: 0; }
.card-x { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 8px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--faint); cursor: pointer; }
.card-x .i { width: 14px; height: 14px; }
.card-x:hover { color: var(--fg); background: color-mix(in srgb, var(--int) 10%, transparent); }
.card.compact .card-x { margin-right: -6px; }
.dismiss-box { display: flex; flex-direction: column; gap: 8px; margin: 0 14px 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.dismiss-box[hidden] { display: none; }
.dismiss-box .field { width: 100%; }
.dismiss-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.farewell { margin: 0; padding: 12px 2px; color: var(--muted); font-size: 14px; }
.card-head .chev { width: 16px; height: 16px; flex: none; color: var(--muted); transition: transform 0.15s ease; }
.card.open .card-head .chev { transform: rotate(180deg); }
button.card-head:hover .chev { color: var(--fg); }
.card.compact .card-head { padding-block: 7px; flex-wrap: wrap; }
.card.compact .card-actions { flex: none; }
.card.compact > .callout, .card.compact > .z-status { margin: 0 14px 10px; }
.card-body { display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px; min-width: 0; }
.card-why, .card-finding, .card-text { margin: 0; font-family: var(--font-read); font-size: 15px; line-height: 1.55; color: var(--fg); max-width: 64ch; overflow-wrap: anywhere; }
.card-label { font-size: 12px; color: var(--muted); margin-bottom: -4px; }
.quiet-line { margin: 0; font-size: 12.5px; color: var(--muted); }
.callout { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--fg); font-size: 13.5px; line-height: 1.5; }
.callout .i { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--warn); }
.callout.strong { box-shadow: inset 0 0 0 1px var(--warn); font-weight: 500; }
.reason { align-self: flex-start; }
.card-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.editor-tools { display: flex; justify-content: flex-end; margin-top: -6px; }
.reveal { display: flex; flex-direction: column; gap: 10px; }
.reveal[hidden] { display: none; }
.checklist, .decisions { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }

// ---------- helpers ----------

function str(v) {
  return typeof v === "string" ? v : v == null ? "" : String(v);
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (k === "value" || k === "disabled" || k === "checked" || k === "open") el[k] = v;
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

// Build an SVG icon. With a label it gets role="img", a tooltip and an accessible name, otherwise it is hidden from assistive tech
function icon(name, label, cls) {
  const svg = document.createElementNS(SVG_NS, "svg");
  const attrs = {
    viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.8",
    "stroke-linecap": "round", "stroke-linejoin": "round", focusable: "false",
    class: "i" + (cls ? " " + cls : ""),
  };
  for (const [k, v] of Object.entries(attrs)) svg.setAttribute(k, v);
  if (label) {
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", label);
    const t = document.createElementNS(SVG_NS, "title");
    t.textContent = label;
    svg.append(t);
  } else {
    svg.setAttribute("aria-hidden", "true");
  }
  for (const [tag, a] of ICONS[name] || []) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(a)) el.setAttribute(k, String(v));
    svg.append(el);
  }
  return svg;
}

function isGithubUrl(u) {
  return typeof u === "string" && u.startsWith(GITHUB_PREFIX);
}

function ghLink(url, text, cls) {
  if (isGithubUrl(url)) {
    return h("a", { href: url, target: "_blank", rel: "noopener noreferrer", class: cls, text });
  }
  return h("span", { class: cls, text });
}

function parseTime(iso) {
  const t = Date.parse(str(iso));
  return Number.isFinite(t) ? t : NaN;
}

function relTime(iso, short) {
  const t = parseTime(iso);
  if (!Number.isFinite(t)) return "";
  const s = Math.round((Date.now() - t) / 1000);
  const future = s < 0;
  const a = Math.abs(s);
  let v;
  if (a < 60) v = "now";
  else if (a < 3600) v = Math.floor(a / 60) + "m";
  else if (a < 86400) v = Math.floor(a / 3600) + "h";
  else if (a < 86400 * 60) v = Math.floor(a / 86400) + "d";
  else v = Math.floor(a / (86400 * 30)) + "mo";
  if (v === "now") return short ? "now" : "just now";
  if (short) return future ? "in " + v : v;
  return future ? "in " + v : v + " ago";
}

function timeEl(iso, prefix, short) {
  const t = parseTime(iso);
  if (!Number.isFinite(t)) return null;
  return h("time", {
    datetime: new Date(t).toISOString(),
    title: new Date(t).toLocaleString(),
    "data-ts": String(t),
    "data-prefix": prefix || "",
    "data-short": short ? "1" : null,
    text: (prefix || "") + relTime(iso, short),
  });
}

function nowIso() {
  return new Date().toISOString();
}

function defaultFilters() {
  return {
    kinds: KINDS.map((k) => k.id), authors: AUTHOR_TYPES.slice(), text: "", showHidden: false, sort: "section",
    budget: DEFAULT_BUDGET_HOURS, extra: null,
  };
}

function loadFilters() {
  const def = defaultFilters();
  try {
    const raw = localStorage.getItem(storeKey("filters"));
    if (!raw) return def;
    const f = JSON.parse(raw);
    return {
      kinds: Array.isArray(f.kinds) ? f.kinds.filter((k) => KINDS.some((x) => x.id === k)) : def.kinds,
      authors: Array.isArray(f.authors) ? f.authors.filter((a) => AUTHOR_TYPES.includes(a)) : def.authors,
      text: typeof f.text === "string" ? f.text : "",
      showHidden: f.showHidden === true,
      sort: SORTS.some((x) => x.id === f.sort) ? f.sort : def.sort,
      budget: BUDGET_HOURS.includes(f.budget) ? f.budget : def.budget,
      extra: f.extra && typeof f.extra.day === "string" && Number.isInteger(f.extra.hours) ? { day: f.extra.day, hours: f.extra.hours } : null,
    };
  } catch {
    return def;
  }
}

function saveFilters() {
  try {
    localStorage.setItem(storeKey("filters"), JSON.stringify(state.filters));
  } catch {
    // Filters stay in memory for this visit
  }
}

function filtersActive() {
  const f = state.filters;
  return f.kinds.length !== KINDS.length || f.authors.length !== AUTHOR_TYPES.length
    || f.text.trim() !== "" || f.showHidden || f.sort !== "section";
}

function isHiddenItem(d) {
  if (d.hidden === true) return true;
  const until = parseTime(d.snoozedUntil);
  return Number.isFinite(until) && until > Date.now();
}

function matchesFilters(d) {
  const f = state.filters;
  if (!f.kinds.includes(str(d.kind))) return false;
  const at = AUTHOR_TYPES.includes(d.authorType) ? d.authorType : "contributor";
  if (!f.authors.includes(at)) return false;
  const q = f.text.trim().toLowerCase();
  if (q) {
    const labels = Array.isArray(d.labels) ? d.labels.map(str).join(" ") : "";
    const hay = [str(d.title), str(d.author), "#" + str(d.number), str(d.number), labels, str(d.state)]
      .join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function sectionOf(d) {
  return SECTION_IDS.has(d.section) ? d.section : FALLBACK_SECTION;
}

function effortOf(d) {
  return Number.isFinite(d.effortMinutes) && d.effortMinutes > 0 ? d.effortMinutes : null;
}

function formatEffort(min) {
  const hours = Math.floor(min / 60);
  const rest = min % 60;
  if (!hours) return rest + " min";
  return rest ? hours + " h " + rest + " min" : hours + " h";
}

function waitingOf(d) {
  return Number.isFinite(d.waitingDays) && d.waitingDays >= 0 ? Math.floor(d.waitingDays) : null;
}

function planEffort(d) {
  return effortOf(d) || DEFAULT_EFFORT_MIN;
}

function dayKey(t) {
  const d = new Date(t);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function recentlyDone(a) {
  const t = parseTime(a.finishedAt || a.createdAt);
  return a.status === "done" && Number.isFinite(t) && Date.now() - t < DAY_MS;
}

// An item counts as handled today when he opened one of its steps on GitHub today, or its latest action was created today and is queued or done
function handledToday(id) {
  if (itemOpenedToday(id)) return true;
  const a = state.latestAction.get(id);
  if (!a || (a.status !== "done" && a.status !== "queued")) return false;
  const t = parseTime(a.createdAt);
  return Number.isFinite(t) && dayKey(t) === dayKey(Date.now());
}

function budgetMinutes() {
  const f = state.filters;
  const extra = f.extra && f.extra.day === dayKey(Date.now()) ? f.extra.hours : 0;
  return (f.budget + extra) * 60;
}

// Count every item handled today, whatever its section or filter, because that time is already gone
function spentMinutes() {
  let sum = 0;
  for (const id of state.latestAction.keys()) {
    if (!handledToday(id)) continue;
    const d = state.items.get(id);
    sum += d ? planEffort(d) : DEFAULT_EFFORT_MIN;
  }
  return sum;
}

function formatSpent(min) {
  const hours = Math.floor(min / 60);
  const rest = min % 60;
  if (hours && rest) return hours + " h " + rest;
  return formatEffort(min || 0).replace(/^0 min$/, "0 h");
}

function compareQuickest(a, b) {
  const ea = effortOf(a.data);
  const eb = effortOf(b.data);
  if (ea !== eb) {
    if (ea == null) return 1;
    if (eb == null) return -1;
    return ea - eb;
  }
  return compareItems(a, b);
}

function compareItems(a, b) {
  const pa = Number.isFinite(a.data.priority) ? a.data.priority : 999;
  const pb = Number.isFinite(b.data.priority) ? b.data.priority : 999;
  if (pa !== pb) return pa - pb;
  const ta = parseTime(a.data.updatedAt);
  const tb = parseTime(b.data.updatedAt);
  return (Number.isFinite(tb) ? tb : 0) - (Number.isFinite(ta) ? ta : 0);
}

function draftKey(itemId, stepKey) {
  return itemId + "/" + stepKey;
}

function getDraft(itemId, stepKey, fallback) {
  const k = draftKey(itemId, stepKey);
  return state.drafts.has(k) ? state.drafts.get(k) : str(fallback);
}

// ---------- header ----------

const els = {
  runInfo: document.getElementById("run-info"),
  filters: document.getElementById("filters"),
  conn: document.getElementById("conn"),
  notice: document.getElementById("notice"),
  board: document.getElementById("board"),
};

function renderHeader() {
  const m = state.meta;
  if (m && parseTime(m.lastRunAt)) {
    els.runInfo.replaceChildren(timeEl(m.lastRunAt, "Last run ") || "");
  } else {
    els.runInfo.textContent = state.loaded.meta ? "No run yet" : "Loading";
  }
  if (controls.button) controls.button.dataset.active = filtersActive() ? "true" : "false";
}

const CONNECTION = {
  connected: ["plug", "Action server connected"],
  queued: ["unplug", "Action server offline. Clicks are queued for the next run."],
  checking: ["dashed", "Checking the action server"],
};

function renderConnection() {
  const [name, label] = CONNECTION[state.server] || CONNECTION.checking;
  els.conn.dataset.state = state.server;
  els.conn.replaceChildren(icon(name, label, "lg"));
}

function setServer(s) {
  if (state.server === s) return;
  state.server = s;
  renderConnection();
}

const controls = { button: null, panel: null };

function setPanelOpen(open, returnFocus) {
  controls.panel.hidden = !open;
  controls.button.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) controls.panel.querySelector("input, button").focus();
  else if (returnFocus) controls.button.focus();
}

function buildFilters() {
  const f = state.filters;
  const changed = () => {
    saveFilters();
    render();
  };
  const chip = (content, on, toggle, title) => {
    const b = h("button", { class: "chip", type: "button", title, "aria-pressed": on ? "true" : "false" }, content);
    b.addEventListener("click", () => {
      toggle();
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      changed();
    });
    return b;
  };
  const toggleIn = (arr, v) => {
    const i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
  };
  const group = (label, ...kids) => h("div", { class: "fpanel-group", role: "group", "aria-label": label },
    h("p", { class: "fpanel-label", text: label }), h("div", { class: "fgroup" }, kids));

  const search = h("input", {
    class: "search", id: "filter-text", type: "search", placeholder: "Search title, author, number, label",
    "aria-label": "Search", value: f.text,
  });
  let t;
  search.addEventListener("input", () => {
    f.text = search.value;
    clearTimeout(t);
    t = setTimeout(changed, 150);
  });

  const sortButtons = SORTS.map((o) => h("button", {
    class: "chip", type: "button", "aria-pressed": f.sort === o.id ? "true" : "false", text: o.label,
    onclick: () => {
      f.sort = o.id;
      for (const [i, b] of sortButtons.entries()) b.setAttribute("aria-pressed", SORTS[i].id === f.sort ? "true" : "false");
      changed();
    },
  }));

  const budgetButtons = BUDGET_HOURS.map((n) => h("button", {
    class: "chip", type: "button", "aria-pressed": f.budget === n ? "true" : "false", text: n + " h",
    onclick: () => {
      f.budget = n;
      for (const [i, b] of budgetButtons.entries()) b.setAttribute("aria-pressed", BUDGET_HOURS[i] === f.budget ? "true" : "false");
      changed();
    },
  }));

  const hiddenBox = h("input", { type: "checkbox", id: "show-hidden", checked: f.showHidden });
  hiddenBox.addEventListener("change", () => {
    f.showHidden = hiddenBox.checked;
    changed();
  });

  const panel = h("div", { class: "fpanel", id: "fpanel", role: "dialog", "aria-label": "Search, filter and sort", hidden: true },
    search,
    group("Kind", KINDS.map((k) => chip([icon(k.icon), k.label], f.kinds.includes(k.id), () => toggleIn(f.kinds, k.id)))),
    group("Author", AUTHOR_TYPES.map((a) => chip(a, f.authors.includes(a), () => toggleIn(f.authors, a)))),
    group("Sort", sortButtons),
    group("Time for today", budgetButtons),
    h("label", { class: "toggle", for: "show-hidden" }, hiddenBox, "Show dismissed and snoozed"));

  const button = h("button", {
    class: "iconbtn ctl-btn", type: "button", "aria-label": "Search, filter and sort", title: "Search, filter and sort",
    "aria-expanded": "false", "aria-controls": "fpanel",
  }, icon("sliders", null, "lg"));
  button.addEventListener("click", () => setPanelOpen(panel.hidden, false));
  panel.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      setPanelOpen(false, true);
    }
  });
  document.addEventListener("pointerdown", (e) => {
    if (!panel.hidden && !els.filters.contains(e.target)) setPanelOpen(false, false);
  });

  controls.button = button;
  controls.panel = panel;
  els.filters.replaceChildren(button, panel);
}

// ---------- groups ----------

const groupEls = new Map();
const planEls = {};

function buildSections() {
  planEls.fill = h("span", { class: "bar-fill" });
  planEls.bar = h("span", { class: "bar", role: "progressbar", "aria-label": "Time spent today", "aria-valuemin": "0" }, planEls.fill);
  planEls.spent = h("span", { class: "sum" });
  planEls.doneText = h("span", { text: "The plan for today is done." });
  planEls.add = h("button", { class: "btn small", type: "button", text: "Add more" });
  planEls.add.addEventListener("click", () => {
    const f = state.filters;
    const today = dayKey(Date.now());
    f.extra = { day: today, hours: (f.extra && f.extra.day === today ? f.extra.hours : 0) + 1 };
    saveFilters();
    render();
  });
  planEls.done = h("span", { class: "plan-done" }, planEls.doneText, planEls.add);
  planEls.el = h("div", { class: "plan", id: "plan" }, planEls.bar, planEls.spent, planEls.done);

  for (const g of GROUPS) {
    const list = h("div", { class: "list" });
    const empty = h("p", { class: "empty-section", text: "Nothing here." });
    const more = h("button", { class: "btn quiet show-all", type: "button", text: "Show more" });
    more.addEventListener("click", () => {
      state.reveal.set(g.id, (state.reveal.get(g.id) || 0) + REVEAL_STEP);
      render();
    });
    const el = h("section", { class: "section group group-" + g.id, id: "group-" + g.id, "aria-labelledby": "group-title-" + g.id },
      h("div", { class: "sec-head" }, h("h2", { id: "group-title-" + g.id, text: g.name })),
      list, empty, more);
    groupEls.set(g.id, { el, list, empty, more });
  }
}

// ---------- shared pieces ----------

function sameDeps(a, b) {
  return a && a.length === b.length && a.every((v, i) => v === b[i]);
}

function authorTypeOf(d) {
  return AUTHOR_TYPES.includes(d.authorType) ? d.authorType : "contributor";
}

function severityClass(sev) {
  const s = str(sev).toLowerCase();
  if (s === "blocker" || s === "critical" || s === "high") return "bad";
  if (s === "major" || s === "medium" || s === "warning") return "warn";
  return "";
}

// Text with `backtick` spans as inline code, built from DOM nodes. An unmatched backtick stays plain text.
function richText(text) {
  const parts = str(text).split("`");
  if (parts.length % 2 === 0) parts.push(parts.splice(-2).join("`"));
  return parts.map((part, i) => (i % 2 ? h("code", { class: "ic", text: part }) : part)).filter((p) => p !== "");
}

const REVIEW_LOOK = {
  approved: ["check", "ok", "Approved"],
  changes_requested: ["changes", "bad", "Changes requested"],
  commented: ["comments", "muted", "Commented"],
  dismissed: ["x", "faint", "Dismissed"],
  pending: ["hourglass", "faint", "Review requested"],
};

function reviewerName(login) {
  return /^copilot-pull-request-reviewer(\[bot\])?$/i.test(login) ? "Copilot" : login;
}

// One badge per reviewer. A submitted review links to GitHub, a requested one does not.
function reviewBadges(d) {
  const reviews = Array.isArray(d.reviews) ? d.reviews.filter((r) => r && typeof r === "object") : [];
  return reviews.map((r) => {
    const st = Object.hasOwn(REVIEW_LOOK, r.state) ? r.state : "commented";
    const [ic, cls, words] = REVIEW_LOOK[st];
    const login = str(r.author);
    const name = reviewerName(login) || "unknown";
    const count = Number.isInteger(r.openThreadCount) && r.openThreadCount > 0 ? r.openThreadCount : 0;
    const when = relTime(r.submittedAt);
    const tip = name + ": " + words + (when ? ", " + when : "") + (count ? ". " + count + " open comment" + (count === 1 ? "" : "s") + "." : "");
    const kids = [avatarEl(login), h("span", { class: "rv-name", text: name }), count ? h("span", { class: "rv-count", text: "· " + count }) : null, icon(ic, words, cls)];
    if (st !== "pending" && isGithubUrl(r.url)) {
      return h("a", { class: "rv rv-" + st, href: r.url, target: "_blank", rel: "noopener noreferrer", title: tip }, kids);
    }
    return h("span", { class: "rv rv-" + st, title: tip }, kids);
  });
}

const THREAD_LOOK = {
  valid: ["fix", "bad"],
  optional: ["optional", ""],
  wrong: ["not needed", "faint"],
  unjudged: ["not judged", "faint"],
};

// Open review threads with the agent's gist and judgement. The raw comment body is never shown.
function buildThreads(threads) {
  const list = Array.isArray(threads) ? threads.filter((t) => t && typeof t === "object") : [];
  if (!list.length) return null;
  const verdictOf = (t) => (Object.hasOwn(THREAD_LOOK, t.verdict) ? t.verdict : "unjudged");
  const counts = {};
  for (const t of list) if (verdictOf(t) !== "unjudged") counts[verdictOf(t)] = (counts[verdictOf(t)] || 0) + 1;
  const parts = ["valid", "optional", "wrong"].filter((v) => counts[v]).map((v) => counts[v] + " " + v);
  return h("details", { class: "threads" },
    h("summary", { "data-focus-key": "threads" }, list.length + " open review comment" + (list.length === 1 ? "" : "s"),
      parts.length ? h("span", { class: "t-counts", text: parts.join(" · ") }) : null),
    h("ul", null, list.map((t) => {
      const [label, cls] = THREAD_LOOK[verdictOf(t)];
      const where = str(t.path) + (Number.isInteger(t.line) ? ":" + t.line : "");
      const refKids = [reviewerName(str(t.author)) || "unknown", where ? " · " : null, where ? h("code", { text: where }) : null];
      return h("li", null,
        h("span", { class: "sev " + cls, text: label }),
        h("span", { class: "f-body" },
          h("span", { class: "t-summary" }, richText(str(t.summary) || "No summary yet.")),
          str(t.note) ? h("span", { class: "t-note" }, richText(t.note)) : null,
          isGithubUrl(t.url)
            ? h("a", { class: "t-ref", href: t.url, target: "_blank", rel: "noopener noreferrer", title: "Open this comment on GitHub" }, refKids)
            : h("span", { class: "t-ref" }, refKids)));
    })));
}

function buildFindings(findings) {
  if (!Array.isArray(findings) || !findings.length) return null;
  const counts = {};
  for (const f of findings) {
    const s = str(f && f.severity) || "note";
    counts[s] = (counts[s] || 0) + 1;
  }
  const parts = Object.entries(counts).map(([s, n]) => n + " " + s);
  return h("details", { class: "findings" },
    h("summary", { "data-focus-key": "findings", text: findings.length + (findings.length === 1 ? " finding" : " findings") + " (" + parts.join(", ") + ")" }),
    h("ul", null, findings.map((f) => {
      const sev = str(f && f.severity) || "note";
      return h("li", null,
        h("span", { class: "sev " + severityClass(sev), text: sev }),
        h("span", { class: "f-body" },
          h("span", { class: "f-text" }, richText(f && f.text)),
          f && f.ref ? h("span", { class: "fref", text: str(f.ref) }) : null));
    })));
}

function buildLinks(links) {
  if (!Array.isArray(links) || !links.length) return null;
  return h("div", { class: "links" }, links.map((l, i) => {
    const label = str(l && l.label) || str(l && l.url);
    if (isGithubUrl(l && l.url)) {
      const a = ghLink(l.url, null);
      a.append(icon("link"), label);
      a.dataset.focusKey = "link:" + i;
      return a;
    }
    return h("span", { class: "blocked", title: "Only github.com links open from the board" }, icon("link"), label);
  }));
}

function statusLine(id) {
  const note = state.notes.get(id);
  if (state.busy.has(id)) {
    return h("div", { class: "status running" }, icon("send"), h("span", { text: "Sending to the action server" }));
  }
  if (note) {
    return h("div", { class: "status " + note.kind }, icon(note.kind === "failed" ? "alert" : "check"), h("span", { text: note.text }));
  }
  const a = state.latestAction.get(id);
  if (!a) return null;
  const name = ACTION_NAMES[a.action] || str(a.action);
  const when = timeEl(a.finishedAt || a.createdAt);
  if (a.status === "queued") {
    const forAgent = AGENT_ACTIONS.has(a.action);
    const analyzing = a.action === "full_review" || a.action === "reanalyze";
    const text = forAgent ? (analyzing ? "The agent is analyzing it again" : "The agent is on it") : "Queued for next run: " + name;
    return h("div", { class: "status queued" }, icon("queued"), h("span", { text }), when);
  }
  if (a.status === "done") {
    const r = str(a.result);
    return h("div", { class: "status done" },
      icon("check"),
      h("span", { text: "Done: " + name }),
      isGithubUrl(r) ? ghLink(r, "view on GitHub") : r ? h("span", { text: r }) : null,
      when);
  }
  if (a.status === "failed") {
    return h("div", { class: "status failed" },
      icon("alert"), h("span", { text: "Failed: " + name + (a.result ? ". " + str(a.result) : "") }), when);
  }
  return null;
}

// Icons that describe an item's state, most important first. Each entry is [icon, class, label, text]
function stateIcons(id, d, dim, withPassing) {
  const out = [];
  // Entries are [icon, class, tooltip, inline text, badge text]. The dialog shows the badge text, list rows only the icon.
  if (state.busy.has(id)) out.push(["send", "muted", "Sending to the action server", null, "Sending"]);
  else {
    const a = state.latestAction.get(id);
    const name = a ? ACTION_NAMES[a.action] || str(a.action) : "";
    if (a && a.status === "queued") out.push(["queued", "warn", "Queued for next run: " + name, null, "Queued"]);
    else if (a && a.status === "failed") out.push(["alert", "bad", "Failed: " + name, null, "Failed: " + name]);
    else if (a && recentlyDone(a)) out.push(["doneCheck", "ok", "Done: " + name, null, "Done: " + name]);
  }
  const open = !isClosedThread(id, d);
  if (d.kind === "pr" && d.ci === "failing") out.push(["ciFail", "bad", "CI failing"]);
  const openThreads = Array.isArray(d.threads) ? d.threads.filter((t) => t && typeof t === "object").length : 0;
  if (openThreads) out.push(["comments", "muted", openThreads + " open review comment" + (openThreads === 1 ? "" : "s"), String(openThreads), openThreads + " open comment" + (openThreads === 1 ? "" : "s")]);
  if (d.kind === "pr" && d.ci === "pending") out.push(["dashed", "warn", "CI pending"]);
  if (withPassing && d.kind === "pr" && d.ci === "passing") out.push(["ciPass", "ok", "CI passing"]);
  if (open && d.solved === true && !(d.kind === "discussion" && d.isAnswered === true)) out.push(["solved", "muted", "Looks solved, still open", null, "Looks solved"]);
  if (d.reviewDepth === "pending") out.push(["eye", "muted", "Not analyzed yet", null, "Not analyzed yet"]);
  if (d.hidden === true) out.push(["archive", "muted", "Dismissed"]);
  else if (dim && withPassing) {
    const until = new Date(parseTime(d.snoozedUntil)).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    out.push(["moon", "muted", "Snoozed until " + until, null, "Snoozed until " + until]);
  }
  return out;
}

// Dialog badge: icon plus a few words, tinted in the icon's color family
function stateBadge([name, cls, label, , short]) {
  return h("span", { class: "sbadge tone-" + (cls || "muted"), title: label }, icon(name, null), short || label);
}

function iconEntry([name, cls, label, text]) {
  const svg = icon(name, label, cls);
  return text ? h("span", { class: "wait " + cls }, svg, text) : svg;
}

const LOGIN_PATTERN = /^[A-Za-z0-9-]{1,39}$/;

function avatarEl(login, url) {
  const placeholder = () => h("span", { class: "avatar ph", "aria-hidden": "true", "data-letter": (login[0] || "?").toUpperCase() });
  if (!LOGIN_PATTERN.test(login)) return placeholder();
  const img = document.createElement("img");
  img.className = "avatar";
  img.alt = "";
  img.width = 18;
  img.height = 18;
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  img.addEventListener("error", () => img.replaceWith(placeholder()), { once: true });
  img.src = typeof url === "string" && /^https:\/\/(github\.com|avatars\.githubusercontent\.com)\//.test(url) ? url : "https://github.com/" + login + ".png?size=40";
  return img;
}

function authorEl(d, cls, withType = true) {
  const login = str(d.author);
  const type = AUTHOR_ICONS[authorTypeOf(d)];
  return h("span", { class: cls, title: login + (type ? ", " + type[1].toLowerCase() : "") },
    avatarEl(login),
    login ? h("span", { class: "a-name", text: login }) : null,
    withType && type ? icon(type[0], type[1], "muted") : null);
}

function finishedBy(id) {
  const a = state.latestAction.get(id);
  return a && a.status === "done" && (a.action === "merge" || a.action === "close") ? a : null;
}

// GitHub state of the thread: a done merge or close from the board, or the server's latest read.
function threadState(id, d) {
  const a = finishedBy(id);
  if (a) {
    if (a.action === "merge") return { state: "MERGED", reason: null };
    const reason = a.params && typeof a.params === "object" && a.params.reason === "not_planned" ? "NOT_PLANNED" : "COMPLETED";
    return { state: "CLOSED", reason };
  }
  const live = d.liveState && typeof d.liveState === "object" ? d.liveState : null;
  if (live && (live.state === "CLOSED" || live.state === "MERGED")) return { state: live.state, reason: str(live.reason) || null };
  return { state: "OPEN", reason: null };
}

function isClosedThread(id, d) {
  return threadState(id, d).state !== "OPEN";
}

// Kind icon: GitHub's state, and for open PRs whether they can be merged. Returns [icon, class, label]
function kindStatus(id, d) {
  const t = threadState(id, d);
  if (d.kind === "pr") {
    if (t.state === "MERGED") return ["prMerged", "violet", "Pull request, merged"];
    if (t.state === "CLOSED") return ["prClosed", "bad", "Pull request, closed"];
    if (d.isDraft === true) return ["prDraft", "faint", "Pull request, draft"];
    // Open PRs show mergeability on the kind icon. The conflict shape has a warning triangle, the closed shape an X.
    if (d.mergeable === "conflicting") return ["prConflict", "bad", "Pull request, has conflicts"];
    if (d.mergeable === "mergeable" && d.ci !== "failing") return ["pr", "ok", "Pull request, ready"];
    return ["pr", "muted", "Pull request, open"];
  }
  if (d.kind === "discussion") {
    if (t.state !== "OPEN") return ["discClosed", "violet", "Discussion, closed"];
    if (d.isAnswered === true) return ["discSolved", "ok", "Discussion, answered"];
    return ["discussion", "neutral", "Discussion, open"];
  }
  if (t.state !== "OPEN") {
    return t.reason === "NOT_PLANNED"
      ? ["issueSlash", "faint", "Issue, closed as not planned"]
      : ["issueSolved", "violet", "Issue, closed as completed"];
  }
  return ["issue", "ok", "Issue, open"];
}

function reviewStatus(d) {
  if (d.kind !== "pr") return null;
  if (d.reviewDecision === "approved") return ["check", "ok", "Review approved"];
  if (d.reviewDecision === "changes_requested") return ["changes", "warn", "Changes requested"];
  if (d.reviewDecision === "pending") return ["hourglass", "faint", "Review pending"];
  return null;
}

function isSnoozed(d) {
  return d.hidden !== true && isHiddenItem(d);
}

function categoryOf(d) {
  if (isSnoozed(d)) return { id: "snoozed", label: "Snoozed" };
  const s = sectionOf(d);
  return { id: s, label: SECTIONS[SECTION_ORDER.get(s)].category };
}

function categoryChip(d) {
  const cat = categoryOf(d);
  return h("span", { class: "cat cat-" + cat.id, text: cat.label });
}

function groupOf(d) {
  if (isHiddenItem(d)) return "later";
  const s = sectionOf(d);
  return GROUPS.find((g) => g.sections.includes(s)).id;
}

// ---------- rows ----------

const MAX_ROW_ICONS = 3;

function effortEl(d) {
  const e = effortOf(d);
  if (!e) return h("span", { class: "r-effort" });
  const hours = e >= 60 && e % 60 === 0;
  return h("span", { class: "r-effort", title: "Estimated time to read up and decide" },
    h("b", { text: String(hours ? e / 60 : e) }), h("small", { text: hours ? "h" : "min" }));
}

function buildRow(id, d, dim, slot) {
  const title = str(d.title) || "(no title)";
  const hint = str(d.hint).trim() || str(recommendedRoute(d)?.title).trim();
  const review = reviewStatus(d);
  const icons = stateIcons(id, d, dim, false).slice(0, MAX_ROW_ICONS).map(iconEntry);
  const type = AUTHOR_ICONS[authorTypeOf(d)];
  if (type) icons.push(icon(type[0], type[1], "muted"));
  const meta = icons.length ? h("span", { class: "r-meta" }, icons) : null;
  return h("button", {
    class: "row" + (dim ? " dim" : ""), type: "button", "data-id": id, "data-slot": slot, "aria-haspopup": "dialog",
    onclick: (e) => openDetail(id, e.currentTarget),
  },
    h("span", { class: "r-kind" }, iconEntry(kindStatus(id, d))),
    h("span", { class: "r-rev" }, review ? iconEntry(review) : null),
    h("span", { class: "r-num", text: "#" + str(d.number) }),
    h("span", { class: "r-cat" }, categoryChip(d)),
    h("span", { class: "r-main" },
      h("span", { class: "r-title", title, text: title }),
      hint ? hintEl(hint) : null),
    authorEl(d, "r-author", false),
    meta,
    effortEl(d),
    ageEl(d));
}

const HINT_ACTIONS = [
  "Request changes", "Start fix", "Take over", "Apply fixes",
  "Merge", "Reply", "Approve", "Close", "Decide", "Review", "Ask", "React", "Snooze", "Dismiss",
];

// Split a hint into its action and the rest, so the action can be bold
function hintParts(hint) {
  const colon = hint.indexOf(":");
  if (colon > 0) return [hint.slice(0, colon), hint.slice(colon)];
  const phrase = HINT_ACTIONS.find((a) => hint.startsWith(a) && (hint.length === a.length || /[\s,.;!?]/.test(hint[a.length])));
  if (phrase) return [phrase, hint.slice(phrase.length)];
  const space = hint.search(/\s/);
  return space < 0 ? [hint, ""] : [hint.slice(0, space), hint.slice(space)];
}

// One intent per kind of action, shared by hint verbs in the list and action buttons in the dialog
const INTENTS = [
  ["finish", ["merge", "approve"], ["Merge", "Approve"]],
  ["close", ["close"], ["Close"]],
  ["talk", ["comment", "review_comment", "react", "answer_discussion"], ["Reply", "Ask", "React"]],
  ["push", ["request_changes"], ["Request changes"]],
  ["think", [], ["Decide", "Review"]],
  ["agent", ["apply_fixes", "start_fix", "full_review", "reanalyze"], ["Take over", "Address review", "Apply fixes", "Start fix", "Drive", "Analyze"]],
  ["away", ["snooze", "dismiss"], ["Snooze", "Dismiss"]],
];

function intentOf(action) {
  const hit = INTENTS.find(([, actions]) => actions.includes(action));
  return hit ? hit[0] : "other";
}

function hintGroup(verb) {
  const a = verb.trim().toLowerCase();
  const hit = INTENTS.find(([, , verbs]) => verbs.some((v) => a === v.toLowerCase() || a.startsWith(v.toLowerCase() + " ")));
  return hit ? hit[0] : null;
}

// Who acts on a step, shown inside its button: the bot's avatar, the maintainer's avatar, or the agent icon
function actorMark(actor) {
  if (actor === "agent") return icon("sparkles", null, "actor-icon");
  const account = actor === "bot" ? boardCap.bot : boardCap.me;
  if (!account || !str(account.login)) return icon(actor === "bot" ? "bot" : "user", null, "actor-icon");
  return avatarEl(str(account.login), account.avatarUrl);
}

function hintEl(hint) {
  const [action, rest] = hintParts(hint);
  const group = hintGroup(action);
  return h("span", { class: "r-hint" + (group ? " act-" + group : "") },
    icon("nextStep"),
    h("span", null, h("span", { class: "h-act", text: action }), rest ? richText(rest) : null));
}

// Show how long someone has waited when that matters, otherwise the plain age
function ageEl(d) {
  const waiting = waitingOf(d);
  if (waiting != null && waiting >= WAITING_CHIP_DAYS) {
    const updated = relTime(d.updatedAt);
    const label = "Waited " + waiting + " days for an answer" + (updated ? ". Updated " + updated + "." : ".");
    return h("span", { class: "r-age" }, iconEntry(["clock", "warn", label, waiting + "d"]));
  }
  return h("span", { class: "r-age" }, timeEl(d.updatedAt, "", true) || "");
}

function visibleRows() {
  return [...document.querySelectorAll("#board .row")];
}

function findRow(id, slot) {
  const rows = [...document.querySelectorAll(".row")].filter((r) => r.dataset.id === id);
  return rows.find((r) => r.dataset.slot === slot) || rows[0] || null;
}

function renderList() {
  const a = document.activeElement;
  const focused = a && a.classList && a.classList.contains("row") ? [a.dataset.id, a.dataset.slot] : null;
  const sorter = state.filters.sort === "quickest" ? compareQuickest : compareItems;

  const byGroup = new Map(GROUPS.map((g) => [g.id, []]));
  for (const [id, d] of state.items) {
    if (d.hidden === true && !state.filters.showHidden) continue;
    if (!matchesFilters(d)) continue;
    const dim = isHiddenItem(d);
    const order = isSnoozed(d) ? SECTIONS.length : SECTION_ORDER.get(sectionOf(d));
    byGroup.get(groupOf(d)).push({ id, data: d, dim, order, planned: false });
  }
  for (const rows of byGroup.values()) rows.sort((x, y) => x.order - y.order || sorter(x, y));

  // Fill the plan in group order and skip items that do not fit the remaining time
  const budget = budgetMinutes();
  const spent = spentMinutes();
  let left = budget - spent;
  let skipped = false;
  let planned = 0;
  for (const g of GROUPS) {
    for (const r of byGroup.get(g.id)) {
      if (r.dim || handledToday(r.id) || finishedBy(r.id)) continue;
      const e = planEffort(r.data);
      if (e > left) {
        skipped = true;
        continue;
      }
      left -= e;
      r.planned = true;
      planned++;
    }
  }

  const ratio = budget > 0 ? Math.min(1, spent / budget) : 0;
  planEls.fill.style.width = (ratio * 100).toFixed(1) + "%";
  planEls.bar.setAttribute("aria-valuemax", String(budget));
  planEls.bar.setAttribute("aria-valuenow", String(Math.min(spent, budget)));
  planEls.spent.textContent = formatSpent(spent) + " of " + formatEffort(budget);
  planEls.bar.setAttribute("aria-valuetext", planEls.spent.textContent);
  planEls.done.hidden = !(planned === 0 && (spent > 0 || skipped) && state.loaded.items);

  for (const g of GROUPS) {
    const rows = byGroup.get(g.id);
    const ordered = [...rows.filter((r) => r.planned), ...rows.filter((r) => !r.planned)];
    const plannedHere = rows.length - rows.filter((r) => !r.planned).length;
    const shown = Math.min(plannedHere, g.cap) + (state.reveal.get(g.id) || 0);
    const sec = groupEls.get(g.id);
    sec.list.replaceChildren(...ordered.slice(0, shown).map(({ id, data, dim }) => buildRow(id, data, dim, g.id)));
    sec.list.hidden = shown === 0 || ordered.length === 0;
    sec.empty.hidden = ordered.length > 0 || !state.loaded.items;
    sec.more.hidden = ordered.length <= shown;
  }

  // The second-line icons never wrap. Icons that do not fit are dropped from the end, the least important first.
  for (const m of els.board.querySelectorAll(".r-meta")) {
    while (m.children.length > 1 && m.scrollWidth > m.clientWidth + 1) m.lastElementChild.remove();
  }

  if (focused) {
    const r = findRow(focused[0], focused[1]);
    if (r) r.focus({ preventScroll: true });
  }
}

// ---------- detail dialog ----------

function partChanged(name, deps) {

function grow(ta) {

function renderDetailHead(d, dim) {
  const ref = ghLink(d.url, "#" + str(d.number), "ref");

  const kind = kindStatus(detail.id, d);

    words ? h("span", { class: "kind-words " + kind[1], text: words.charAt(0).toUpperCase() + words.slice(1) }) : null, categoryChip(d));
  detail.title.textContent = str(d.title) || "(no title)";

  const waiting = waitingOf(d);

  const meta = [
    effortOf(d) ? h("span", { class: "tag effort", title: "Estimated time to read up and decide", text: formatEffort(effortOf(d)) }) : null,
    waiting != null ? iconEntry(["clock", waiting >= WAITING_CHIP_DAYS ? "warn" : "muted", "An outside person has waited " + waiting + " days for an answer", waiting + "d"]) : null,
    authorEl(d, "d-author", false),
