<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 814" width="940" height="814" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How Gary runs</title>
<desc id="desc">An hourly task, a click on the board or news on a watched PR reach the master session. It starts triage workers and request workers. They write items for the board, and your clicks reach GitHub.</desc>
<style>
.bg{fill:#f6f8fa} .box{fill:#fff;stroke:#d0d7de} .g{fill:none;stroke:#afb8c1;stroke-dasharray:5 4}
.chip{fill:#f6f8fa;stroke:#d0d7de} .t{font-size:14px;font-weight:600;fill:#1f2328} .p{font-size:12px;fill:#59636e}
.c{font-size:10.5px;fill:#59636e;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{font-size:12px;fill:#59636e} .h{font-size:11px;letter-spacing:.08em;fill:#59636e} .a{fill:none;stroke:#59636e;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect class="bg" width="940" height="814" rx="12"/>
<text x="24" y="36" class="h">WHAT STARTS WORK</text>
<rect x="24" y="48" width="289" height="74" rx="8" class="box"/>
<rect x="24" y="48" width="4" height="74" rx="2" fill="#d97706"/>
<text x="40" y="71" class="t">Every hour</text>
<text x="40" y="91" class="p">One scheduled task starts the master</text>
<text x="40" y="107" class="p">session.</text>
<rect x="325" y="48" width="289" height="74" rx="8" class="box"/>
<rect x="325" y="48" width="4" height="74" rx="2" fill="#d97706"/>
<text x="341" y="71" class="t">Your click</text>
<text x="341" y="91" class="p">An agent card on the board puts a request</text>
<text x="341" y="107" class="p">into the queue.</text>
<rect x="627" y="48" width="289" height="74" rx="8" class="box"/>
<rect x="627" y="48" width="4" height="74" rx="2" fill="#d97706"/>
<text x="643" y="71" class="t">News on a watched PR</text>
<text x="643" y="91" class="p">A bot review arrived, you commented, or an</text>
<text x="643" y="107" class="p">author answered a format offer.</text>
<path d="M470.0 126 V146 M465.0 140 L470.0 147 L475.0 140" class="a"/>
<rect x="24" y="154" width="440" height="90" rx="8" class="box"/>
<rect x="24" y="154" width="4" height="90" rx="2" fill="#2563eb"/>
<text x="40" y="177" class="t">Master session</text>
<rect x="402" y="163" width="52" height="19" rx="9.5" class="chip"/>
<text x="428" y="176.5" class="c" text-anchor="middle">Sonnet</text>
<text x="40" y="197" class="p">One per machine. Starts the board server, watches the queue of all</text>
<text x="40" y="213" class="p">projects and starts workers. Never reads items or diffs. Never writes</text>
<text x="40" y="229" class="p">to GitHub.</text>
<rect x="476" y="154" width="440" height="90" rx="8" class="box"/>
<rect x="476" y="154" width="4" height="90" rx="2" fill="#2563eb"/>
<text x="492" y="177" class="t">Board server</text>
<rect x="802" y="163" width="104" height="19" rx="9.5" class="chip"/>
<text x="854" y="176.5" class="c" text-anchor="middle">Node, no model</text>
<text x="492" y="197" class="p">Serves the board on 127.0.0.1. Stores your clicks, checks every rule</text>
<text x="492" y="213" class="p">in code, and sends what you clicked to GitHub.</text>
<path d="M470.0 248 V268 M465.0 262 L470.0 269 L475.0 262" class="a"/>
<text x="482.0" y="263" class="l">starts</text>
<rect x="24" y="276" width="440.0" height="370" rx="10" class="g"/><rect x="476.0" y="276" width="440.0" height="370" rx="10" class="g"/>
<text x="34" y="296" class="l">Each hour, per project</text>
<rect x="34" y="304" width="420" height="74" rx="8" class="box"/>
<rect x="34" y="304" width="4" height="74" rx="2" fill="#059669"/>
<text x="50" y="327" class="t">Triage worker</text>
<rect x="392" y="313" width="52" height="19" rx="9.5" class="chip"/>
<text x="418" y="326.5" class="c" text-anchor="middle">Sonnet</text>
<text x="50" y="347" class="p">Snapshots open PRs, issues and discussions. Sorts out what</text>
<text x="50" y="363" class="p">changed. Writes the items for the board.</text>
<path d="M244.0 382 V402 M239.0 396 L244.0 403 L249.0 396" class="a"/>
<text x="256.0" y="397" class="l">hands to subagents</text>
<rect x="34" y="410" width="204" height="90" rx="8" class="box"/>
<rect x="34" y="410" width="4" height="90" rx="2" fill="#7c3aed"/>
<text x="50" y="433" class="t">Classify</text>
<rect x="176" y="419" width="52" height="19" rx="9.5" class="chip"/>
<text x="202" y="432.5" class="c" text-anchor="middle">Sonnet</text>
<text x="50" y="453" class="p">25 items per subagent.</text>
<text x="50" y="469" class="p">Optional fast tier on Haiku</text>
<text x="50" y="485" class="p">for obvious items.</text>
<rect x="250" y="410" width="204" height="90" rx="8" class="box"/>
<rect x="250" y="410" width="4" height="90" rx="2" fill="#7c3aed"/>
<text x="266" y="433" class="t">Full PR review</text>
<rect x="404" y="419" width="40" height="19" rx="9.5" class="chip"/>
<text x="424" y="432.5" class="c" text-anchor="middle">Opus</text>
<text x="266" y="453" class="p">Up to 10 per run. May post</text>
<text x="266" y="469" class="p">the opt-in automatic first</text>
<text x="266" y="485" class="p">review.</text>
<rect x="34" y="512" width="204" height="74" rx="8" class="box"/>
<rect x="34" y="512" width="4" height="74" rx="2" fill="#7c3aed"/>
<text x="50" y="535" class="t">Issue triage</text>
<rect x="188" y="521" width="40" height="19" rx="9.5" class="chip"/>
<text x="208" y="534.5" class="c" text-anchor="middle">Opus</text>
<text x="50" y="555" class="p">Reads logs and attachments.</text>
<text x="50" y="571" class="p">Searches for duplicates.</text>
<rect x="250" y="512" width="204" height="74" rx="8" class="box"/>
<rect x="250" y="512" width="4" height="74" rx="2" fill="#7c3aed"/>
<text x="266" y="535" class="t">Automatic fix</text>
<rect x="404" y="521" width="40" height="19" rx="9.5" class="chip"/>
<text x="424" y="534.5" class="c" text-anchor="middle">Opus</text>
<text x="266" y="555" class="p">Failing test, fix and a draft</text>
<text x="266" y="571" class="p">PR. Up to 2 per run.</text>
<text x="486.0" y="296" class="l">Within seconds, per request</text>
<rect x="486" y="304" width="420" height="74" rx="8" class="box"/>
<rect x="486" y="304" width="4" height="74" rx="2" fill="#059669"/>
<text x="502" y="327" class="t">Request worker</text>
<rect x="856" y="313" width="40" height="19" rx="9.5" class="chip"/>
<text x="876" y="326.5" class="c" text-anchor="middle">Opus</text>
<text x="502" y="347" class="p">One per click or event: start a fix, take over a PR, address</text>
<text x="502" y="363" class="p">review comments, change a PR, format, analyze again.</text>
<rect x="486" y="390" width="420" height="74" rx="8" class="box"/>
<rect x="486" y="390" width="4" height="74" rx="2" fill="#059669"/>
<text x="502" y="413" class="t">Drive rounds</text>
<rect x="856" y="399" width="40" height="19" rx="9.5" class="chip"/>
<text x="876" y="412.5" class="c" text-anchor="middle">Opus</text>
<text x="502" y="433" class="p">On Gary's own fix PRs: request a bot review, push fixes for its</text>
<text x="502" y="449" class="p">comments for up to 3 rounds, mark the PR ready.</text>
<rect x="486" y="476" width="420" height="74" rx="8" class="box"/>
<rect x="486" y="476" width="4" height="74" rx="2" fill="#059669"/>
<text x="502" y="499" class="t">Focus session</text>
<text x="502" y="519" class="p">You and one agent on one item. The master finds the session that</text>
<text x="502" y="535" class="p">has the branch, or starts one. Gary holds the item meanwhile.</text>
<rect x="486" y="562" width="420" height="74" rx="8" class="box"/>
<rect x="486" y="562" width="4" height="74" rx="2" fill="#059669"/>
<text x="502" y="585" class="t">Learn and reconcile</text>
<rect x="856" y="571" width="40" height="19" rx="9.5" class="chip"/>
<text x="876" y="584.5" class="c" text-anchor="middle">Opus</text>
<text x="502" y="605" class="p">Daily: proposes rules from your decisions. Weekly: checks the</text>
<text x="502" y="621" class="p">rules for repeats and conflicts.</text>
<path d="M470.0 650 V670 M465.0 664 L470.0 671 L475.0 664" class="a"/>
<text x="482.0" y="665" class="l">write items and proposals</text>
<rect x="24" y="678" width="289" height="90" rx="8" class="box"/>
<rect x="24" y="678" width="4" height="90" rx="2" fill="#db2777"/>
<text x="40" y="701" class="t">The board</text>
<text x="40" y="721" class="p">Your plan for today. Each item has a</text>
<text x="40" y="737" class="p">verdict, a story and cards with the next</text>
<text x="40" y="753" class="p">step.</text>
<rect x="325" y="678" width="289" height="90" rx="8" class="box"/>
<rect x="325" y="678" width="4" height="90" rx="2" fill="#db2777"/>
<text x="341" y="701" class="t">You click</text>
<text x="341" y="721" class="p">Replies in your name are copied for you to</text>
<text x="341" y="737" class="p">post. Merges and closes stay yours.</text>
<rect x="627" y="678" width="289" height="90" rx="8" class="box"/>
<rect x="627" y="678" width="4" height="90" rx="2" fill="#db2777"/>
<text x="643" y="701" class="t">GitHub</text>
<text x="643" y="721" class="p">Reviews, labels and pushes go out as the</text>
<text x="643" y="737" class="p">bot, after your click.</text>
<rect x="24" y="781" width="10" height="10" rx="2" fill="#d97706"/><text x="40" y="790" class="l">trigger</text>
<rect x="112.1" y="781" width="10" height="10" rx="2" fill="#2563eb"/><text x="128.1" y="790" class="l">always running</text>
<rect x="244.29999999999998" y="781" width="10" height="10" rx="2" fill="#059669"/><text x="260.29999999999995" y="790" class="l">worker session</text>
<rect x="376.5" y="781" width="10" height="10" rx="2" fill="#7c3aed"/><text x="392.5" y="790" class="l">subagent of a worker</text>
<rect x="546.5" y="781" width="10" height="10" rx="2" fill="#db2777"/><text x="562.5" y="790" class="l">result</text>
</svg>
